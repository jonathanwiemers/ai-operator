{{- if .Values.ui.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ai-operator.ui.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ai-operator.ui.labels" . | nindent 4 }}
---
# The UI only reads; it gets no access to Secrets, Pods or the GitLab tokens.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "ai-operator.ui.fullname" . }}
  labels:
    {{- include "ai-operator.ui.labels" . | nindent 4 }}
rules:
  - apiGroups: ["ai.wiemers.me"]
    resources: ["agentprojects", "agenttasks"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "ai-operator.ui.fullname" . }}
  labels:
    {{- include "ai-operator.ui.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "ai-operator.ui.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "ai-operator.ui.fullname" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
