{{- if .Values.ui.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ai-operator.ui.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ai-operator.ui.labels" . | nindent 4 }}
---
# The UI only reads; it gets no access to Secrets or the GitLab tokens. In
# the agent namespaces it may read the pods' logs, for live transcripts
# (shown only to roles with transcript: true in ui.authorization.rules).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "ai-operator.ui.fullname" . }}
  labels:
    {{- include "ai-operator.ui.labels" . | nindent 4 }}
rules:
  - apiGroups: ["ai.wiemers.me"]
    resources: ["agentprojects", "agenttasks"]
    verbs: ["get", "list", "watch"]
  {{- if .Values.research.database.host }}
  # The Research section (shown only to roles with a research rule).
  - apiGroups: ["ai.wiemers.me"]
    resources: ["agentresearches"]
    verbs: ["get", "list", "watch"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "ai-operator.ui.fullname" . }}
  labels:
    {{- include "ai-operator.ui.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "ai-operator.ui.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "ai-operator.ui.fullname" . }}
    namespace: {{ .Release.Namespace }}
{{- range .Values.agent.namespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "ai-operator.ui.fullname" $ }}-logs
  namespace: {{ . }}
  labels:
    {{- include "ai-operator.ui.labels" $ | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "ai-operator.ui.fullname" $ }}-logs
  namespace: {{ . }}
  labels:
    {{- include "ai-operator.ui.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "ai-operator.ui.fullname" $ }}-logs
subjects:
  - kind: ServiceAccount
    name: {{ include "ai-operator.ui.fullname" $ }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
