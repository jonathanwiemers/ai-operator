apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ai-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ai-operator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "ai-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ai-operator.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "ai-operator.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: manager
          image: {{ include "ai-operator.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --metrics-bind-address=:{{ .Values.metrics.port }}
            - --health-probe-bind-address=:{{ .Values.healthProbePort }}
            {{- if .Values.webhook.enabled }}
            - --webhook-bind-address=:{{ .Values.webhook.port }}
            {{- end }}
            - --zap-log-level={{ .Values.logLevel }}
            {{- $agentLevels := list "debug" "info" "error" }}
            {{- if .Values.agent.logLevel }}
            {{- if not (has .Values.agent.logLevel $agentLevels) }}
            {{- fail "agent.logLevel must be debug, info or error" }}
            {{- end }}
            - --agent-log-level={{ .Values.agent.logLevel }}
            {{- else if has .Values.logLevel $agentLevels }}
            - --agent-log-level={{ .Values.logLevel }}
            {{- end }}
            {{- if .Values.leaderElection }}
            - --leader-elect
            {{- end }}
            {{- with include "ai-operator.agentImage" . }}
            - --default-agent-image={{ . }}
            {{- end }}
            {{- with .Values.defaultOwners }}
            - --default-owners={{ join "," . }}
            {{- end }}
            {{- $db := .Values.research.database }}
            {{- if $db.host }}
            {{- if not $db.name }}
            {{- fail "research.database.name is required with research.database.host" }}
            {{- end }}
            {{- if not $db.ownerSecret.name }}
            {{- fail "research.database.ownerSecret.name is required with research.database.host" }}
            {{- end }}
            - --research-db-host={{ $db.host }}
            - --research-db-port={{ $db.port }}
            - --research-db-name={{ $db.name }}
            - --research-db-sslmode={{ $db.sslMode }}
            {{- with $db.readerRole }}
            - --research-reader-role={{ . }}
            {{- end }}
            {{- with $db.writerRoles }}
            - --research-writer-roles={{ join "," . }}
            {{- end }}
            {{- with $db.chatWriterRole }}
            {{/* The UI's chat login; slice 5 wires the UI. */}}
            - --research-chat-writer-role={{ . }}
            {{- end }}
            - {{ printf "--research-candidates-quick=%s" (include "ai-operator.research.candidates" .Values.research.candidates.quick) | quote }}
            - {{ printf "--research-candidates-deep=%s" (include "ai-operator.research.candidates" .Values.research.candidates.deep) | quote }}
            - --research-max-usage-percent={{ int .Values.research.maxUsagePercent }}
            - --history-retention={{ .Values.research.historyRetention }}
            {{- end }}
            {{- range .Values.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          {{- if $db.host }}
          env:
            - name: AI_RESEARCH_DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ $db.ownerSecret.name }}
                  key: {{ $db.ownerSecret.usernameKey }}
            - name: AI_RESEARCH_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $db.ownerSecret.name }}
                  key: {{ $db.ownerSecret.passwordKey }}
          {{- end }}
          ports:
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
            - name: probes
              containerPort: {{ .Values.healthProbePort }}
            {{- if .Values.webhook.enabled }}
            - name: webhook
              containerPort: {{ .Values.webhook.port }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: probes
            initialDelaySeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: probes
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
