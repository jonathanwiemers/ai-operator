{{- /*
Research-run pods (label ai.wiemers.me/research) may reach the research
database, which the agent NetworkPolicy blocks with the cluster CIDRs.
NetworkPolicies are additive: task pods are not selected and stay blocked.
*/ -}}
{{- $db := .Values.research.database }}
{{- if and .Values.agent.networkPolicy.enabled $db.host $db.networkPolicyPeer.namespace }}
{{- range $ns := .Values.agent.namespaces }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ai-operator.agentClusterRole" $ }}-research-db
  namespace: {{ $ns }}
  labels:
    {{- include "ai-operator.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - {key: ai.wiemers.me/research, operator: Exists}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $db.networkPolicyPeer.namespace }}
          {{- with $db.networkPolicyPeer.podLabels }}
          podSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
          {{- end }}
      ports:
        - {protocol: TCP, port: {{ $db.port }}}
{{- end }}
{{- end }}
