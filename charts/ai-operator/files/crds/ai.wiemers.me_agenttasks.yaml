---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: agenttasks.ai.wiemers.me
spec:
  group: ai.wiemers.me
  names:
    kind: AgentTask
    listKind: AgentTaskList
    plural: agenttasks
    shortNames:
    - at
    singular: agenttask
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.type
      name: Type
      type: string
    - jsonPath: .spec.issue.iid
      name: Issue
      type: integer
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.run.currentStep
      name: Step
      type: string
    - jsonPath: .status.run.lastResult
      name: Result
      type: string
    - jsonPath: .status.run.runCount
      name: Runs
      type: integer
    - jsonPath: .status.run.costUSD
      name: Cost
      type: string
    - jsonPath: .status.ci.state
      name: CI
      type: string
    - jsonPath: .status.run.deferredUntil
      name: Retry
      priority: 1
      type: date
    - jsonPath: .status.run.mergeRequestURL
      name: MR
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          AgentTask is one unit of agent work: planning a milestone or implementing
          an issue. It owns the agent pod and the workspace PVC.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              AgentTaskSpec is the desired state of an AgentTask. It is owned by the
              operator: the project controller creates tasks and bumps RunRequest
              whenever GitLab asks for (more) work.
            properties:
              autopilot:
                description: |-
                  Autopilot is set for tasks of autopilot milestones: the agents must
                  not ask questions but take their defaults and record them.
                type: boolean
              issue:
                description: Issue implemented by this task (Implement tasks only).
                properties:
                  id:
                    format: int64
                    type: integer
                  iid:
                    format: int64
                    type: integer
                  title:
                    type: string
                  webURL:
                    type: string
                required:
                - id
                - iid
                - title
                type: object
              milestone:
                description: Milestone the task belongs to.
                properties:
                  id:
                    format: int64
                    type: integer
                  iid:
                    format: int64
                    type: integer
                  title:
                    type: string
                required:
                - id
                - iid
                - title
                type: object
              projectRef:
                description: ProjectRef is the name of the AgentProject in the same
                  namespace.
                type: string
              runRequest:
                description: |-
                  RunRequest is a monotonically increasing counter. Every increment asks
                  the runner for exactly one more run. The runner acknowledges by setting
                  status.run.observedRunRequest.
                format: int64
                type: integer
              source:
                description: |-
                  Source records which GitLab state the operator has already turned into
                  run requests, so that every change triggers exactly one run.
                properties:
                  ciFixPipelineID:
                    description: |-
                      CIFixPipelineID is the failed pipeline the operator asked the agent to
                      fix with the latest run request.
                    format: int64
                    type: integer
                  descriptionHash:
                    description: DescriptionHash of the milestone description (Spec
                      tasks).
                    type: string
                  issueUpdatedAt:
                    description: |-
                      IssueUpdatedAt / MergeRequestUpdatedAt let the operator skip fetching
                      comments when nothing changed.
                    format: date-time
                    type: string
                  lastCommandNoteID:
                    description: |-
                      LastCommandNoteID is the newest "/agent" comment that was turned into a
                      run request (Implement tasks).
                    format: int64
                    type: integer
                  mergeBaseFor:
                    description: |-
                      MergeBaseFor is the merge request head the operator saw conflicting
                      with the default branch. The next run merges the default branch into
                      the work branch and has the agent resolve the conflicts; it is asked
                      once per head.
                    type: string
                  mergeRequestUpdatedAt:
                    format: date-time
                    type: string
                type: object
              suspend:
                description: 'Suspend hibernates the task: its pod is deleted, the
                  workspace is kept.'
                type: boolean
              type:
                description: Type of the task.
                enum:
                - Spec
                - Implement
                type: string
            required:
            - projectRef
            - type
            type: object
          status:
            description: |-
              AgentTaskStatus is the observed state of an AgentTask. The top-level fields
              are written by the operator, Run is written by the runner inside the pod.
              Both sides use merge patches so they never overwrite each other.
            properties:
              agentMemoryLimit:
                description: |-
                  AgentMemoryLimit is the agent container's memory limit for this task,
                  raised by the operator after OOM kills (see agents.maxMemory). It
                  applies while it is above the project's limit.
                type: string
              agentTermination:
                description: |-
                  AgentTermination is the last time the agent container stopped while
                  its pod ran (it is restarted in place), e.g. killed for using more than
                  its memory limit. The runner names it when a run loses the agent.
                properties:
                  exitCode:
                    format: int32
                    type: integer
                  finishedAt:
                    format: date-time
                    type: string
                  memoryLimit:
                    description: MemoryLimit of the container, if it has one.
                    type: string
                  reason:
                    description: Reason as the kubelet reports it, e.g. OOMKilled
                      or Error.
                    type: string
                  restarts:
                    description: Restarts of the container in its pod so far.
                    format: int32
                    type: integer
                type: object
              autopilot:
                description: |-
                  Autopilot is the operator's queue of an autopilot milestone (spec
                  tasks).
                properties:
                  items:
                    description: 'Items in queue order: dependencies first, ties in
                      plan order.'
                    items:
                      description: AutopilotItem is one issue in the queue of an autopilot
                        milestone.
                      properties:
                        decisions:
                          description: Decisions recorded on the issue, collected
                            when it was merged.
                          items:
                            description: DecisionRef points to a decision recorded
                              on an issue.
                            properties:
                              id:
                                type: string
                              superseded:
                                type: boolean
                              title:
                                type: string
                              url:
                                type: string
                            required:
                            - id
                            type: object
                          type: array
                        iid:
                          format: int64
                          type: integer
                        markedReady:
                          description: |-
                            MarkedReady is set once the operator marked the draft MR ready, or
                            found it ready, to run CI. A draft again after that is a human holding
                            it, or a run that left problems.
                          type: boolean
                        mergeRequestIID:
                          description: MergeRequestIID and MergeRequestURL of the
                            issue's merge request.
                          format: int64
                          type: integer
                        mergeRequestURL:
                          type: string
                        mergedSHA:
                          description: MergedSHA is the commit the merge request was
                            merged as.
                          type: string
                        rebasedAt:
                          description: RebasedAt is when the rebase was requested.
                          format: date-time
                          type: string
                        rebasedDiff:
                          description: |-
                            RebasedDiff is a hash of the reviewed change, taken before the rebase.
                            The rebased head is only treated as reviewed if its change hashes the
                            same, i.e. the rebase moved the change without changing it.
                          type: string
                        rebasedFrom:
                          description: |-
                            RebasedFrom is the head the operator asked GitLab to rebase; set
                            while the rebase is in progress.
                          type: string
                        rebases:
                          description: Rebases counts the rebases of this item; only
                            one is attempted.
                          format: int32
                          type: integer
                        revisitOf:
                          description: |-
                            RevisitOf is set for follow-up issues the operator created to revisit
                            a decision of a merged issue: the decision's ID.
                          type: string
                        state:
                          description: AutopilotItemState is the state of one issue
                            in the queue.
                          enum:
                          - Pending
                          - Active
                          - Merged
                          - Skipped
                          type: string
                      required:
                      - iid
                      - state
                      type: object
                    type: array
                  lastCommandNoteID:
                    description: |-
                      LastCommandNoteID is the newest command on the tracking issue the
                      operator has handled.
                    format: int64
                    type: integer
                  pausedReason:
                    description: Reason why the milestone is paused.
                    type: string
                  phase:
                    description: AutopilotPhase is the state of an autopilot milestone.
                    enum:
                    - Running
                    - Paused
                    - Done
                    - "Off"
                    type: string
                  trackingHash:
                    description: |-
                      TrackingHash is the hash of the tracking issue's last rendered
                      description, so it is only edited when it changes.
                    type: string
                  trackingIssueIID:
                    description: TrackingIssueIID is the bot's tracking issue of the
                      milestone.
                    format: int64
                    type: integer
                required:
                - phase
                type: object
              ci:
                description: CI is the operator's view of the pipeline of the agent's
                  last push.
                properties:
                  failedJobs:
                    description: FailedJobs of the latest failed pipeline.
                    items:
                      type: string
                    type: array
                  pipelineID:
                    format: int64
                    type: integer
                  pipelineURL:
                    type: string
                  retried:
                    description: Retried is set once the failed jobs of the pipeline
                      were retried.
                    type: boolean
                  sha:
                    description: SHA of the pushed commit this status is about.
                    type: string
                  state:
                    description: CIState is the state of the pipeline of the agent's
                      last push.
                    enum:
                    - Pending
                    - Running
                    - Fixing
                    - Success
                    - Failed
                    - BaseFailing
                    - Canceled
                    - None
                    type: string
                required:
                - sha
                - state
                type: object
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              message:
                type: string
              phase:
                description: TaskPhase is a coarse summary of where a task is in its
                  lifecycle.
                enum:
                - Pending
                - Queued
                - Running
                - Waiting
                - Idle
                - Hibernated
                - Archived
                - Blocked
                type: string
              plan:
                description: Plan is the spec agent's last plan, in plan order (spec
                  tasks).
                items:
                  description: PlannedIssue is one issue of a milestone plan.
                  properties:
                    dependsOn:
                      description: DependsOn are the IIDs of planned issues that must
                        be merged first.
                      items:
                        format: int64
                        type: integer
                      type: array
                    iid:
                      format: int64
                      type: integer
                    key:
                      description: Key is the planner's stable identifier of the issue.
                      type: string
                    linked:
                      description: |-
                        Linked are the dependencies the operator linked as GitLab issue
                        links; only these are unlinked when the plan drops them.
                      items:
                        format: int64
                        type: integer
                      type: array
                    title:
                      type: string
                  required:
                  - iid
                  - key
                  type: object
                type: array
              podName:
                type: string
              revisits:
                description: |-
                  Revisits tracks the "/agent revisit" comments the operator handled on
                  closed issues of the milestone and on its tracking issue (spec tasks).
                properties:
                  checkedAt:
                    description: CheckedAt is the time of the last check.
                    format: date-time
                    type: string
                  lastNoteIDs:
                    additionalProperties:
                      format: int64
                      type: integer
                    description: LastNoteIDs is the newest handled comment per issue
                      IID.
                    type: object
                  since:
                    description: |-
                      Since is when the operator started watching; older comments are
                      ignored.
                    format: date-time
                    type: string
                required:
                - checkedAt
                - since
                type: object
              run:
                description: RunStatus is reported by the runner.
                properties:
                  activeRunRequest:
                    description: ActiveRunRequest is the run request the runner is
                      currently working on.
                    format: int64
                    type: integer
                  blockingFindings:
                    description: |-
                      BlockingFindings is the number of blocker and major review findings
                      left after the last review.
                    format: int32
                    type: integer
                  branch:
                    description: Branch the agent pushes to.
                    type: string
                  ciFixedPipelineID:
                    description: CIFixedPipelineID is the failed pipeline the last
                      CI fix run handled.
                    format: int64
                    type: integer
                  ciRound:
                    description: CIRound counts the CI fix runs since the last push
                      a human asked for.
                    format: int32
                    type: integer
                  costUSD:
                    description: CostUSD is the accumulated model spend of this task,
                      as a decimal string.
                    type: string
                  currentStep:
                    description: |-
                      CurrentStep is the step the runner is working on, e.g. "9 run
                      implementer". It is empty between runs.
                    type: string
                  deferrals:
                    description: |-
                      Deferrals counts consecutive deferrals of the current run request; it
                      drives the exponential backoff when the reset time is unknown.
                    format: int32
                    type: integer
                  deferredUntil:
                    description: |-
                      DeferredUntil is set when the requested run hit a usage or rate limit:
                      the run is retried after this time.
                    format: date-time
                    type: string
                  lastActivityTime:
                    description: LastActivityTime is when the runner last started
                      or finished a run.
                    format: date-time
                    type: string
                  lastResult:
                    description: LastResult of the most recent run.
                    type: string
                  limitedEngine:
                    description: LimitedEngine is the engine whose limit deferred
                      the run.
                    enum:
                    - claude
                    - cursor
                    type: string
                  mergeRequestIID:
                    description: MergeRequestIID of the agent's merge request.
                    format: int64
                    type: integer
                  mergeRequestURL:
                    description: MergeRequestURL of the agent's merge request.
                    type: string
                  mergedBaseFor:
                    description: |-
                      MergedBaseFor is the head the last merge of the default branch was
                      asked for (spec.source.mergeBaseFor).
                    type: string
                  observedRunRequest:
                    description: ObservedRunRequest is the last run request the runner
                      has finished.
                    format: int64
                    type: integer
                  oomRetries:
                    description: |-
                      OOMRetries counts runs of the current request started again after the
                      agent container ran out of memory.
                    format: int32
                    type: integer
                  pushedAt:
                    description: PushedAt is when PushedSHA was pushed.
                    format: date-time
                    type: string
                  pushedSHA:
                    description: PushedSHA is the commit the runner last pushed to
                      the agent's branch.
                    type: string
                  reviewErrors:
                    description: ReviewErrors is the number of reviewers that failed
                      in the last review.
                    format: int32
                    type: integer
                  reviewedSHA:
                    description: |-
                      ReviewedSHA is the commit the last review saw. Runs without a review
                      (CI fix runs) can push commits after it, so a clean review only covers
                      PushedSHA when the two are equal.
                    type: string
                  runCount:
                    description: RunCount is the number of runs performed so far.
                    format: int32
                    type: integer
                  summary:
                    description: Summary of the most recent run.
                    type: string
                type: object
              workspaceClaimName:
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
