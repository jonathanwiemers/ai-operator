---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: agenttasks.ai.wiemers.me
spec:
  group: ai.wiemers.me
  names:
    kind: AgentTask
    listKind: AgentTaskList
    plural: agenttasks
    shortNames:
    - at
    singular: agenttask
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.type
      name: Type
      type: string
    - jsonPath: .spec.issue.iid
      name: Issue
      type: integer
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.run.currentStep
      name: Step
      type: string
    - jsonPath: .status.run.lastResult
      name: Result
      type: string
    - jsonPath: .status.run.runCount
      name: Runs
      type: integer
    - jsonPath: .status.run.costUSD
      name: Cost
      type: string
    - jsonPath: .status.ci.state
      name: CI
      type: string
    - jsonPath: .status.run.deferredUntil
      name: Retry
      priority: 1
      type: date
    - jsonPath: .status.run.mergeRequestURL
      name: MR
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          AgentTask is one unit of agent work: planning a milestone or implementing
          an issue. It owns the agent pod and the workspace PVC.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              AgentTaskSpec is the desired state of an AgentTask. It is owned by the
              operator: the project controller creates tasks and bumps RunRequest
              whenever GitLab asks for (more) work.
            properties:
              autopilot:
                description: |-
                  Autopilot is set for tasks of autopilot milestones: the agents must
                  not ask questions but take their defaults and record them.
                type: boolean
              budgetStop:
                description: |-
                  BudgetStop is set by the operator on implement tasks while autopilot
                  is paused for their budget (the issue's, or the milestone's for all
                  of its implement tasks). The runner starts no further agent call: a
                  run in progress ends deferred after its current call, a pending one
                  waits until the flag is cleared. Desk chat turns still run.
                type: boolean
              budgetUSD:
                description: |-
                  BudgetUSD is the milestone's budget in USD, from its description's
                  line "/agent budget <usd>" (spec tasks). Empty: no budget. On implement
                  tasks the issue's budget, from an "/agent budget <usd>" comment on it,
                  in place of the project's budget.perIssueUSD.
                type: string
              issue:
                description: |-
                  Issue implemented by this task (Implement tasks), or the tracking
                  issue the pilot listens on (Coordinate tasks).
                properties:
                  id:
                    format: int64
                    type: integer
                  iid:
                    format: int64
                    type: integer
                  title:
                    type: string
                  webURL:
                    type: string
                required:
                - id
                - iid
                - title
                type: object
              milestone:
                description: Milestone the task belongs to.
                properties:
                  id:
                    format: int64
                    type: integer
                  iid:
                    format: int64
                    type: integer
                  title:
                    type: string
                required:
                - id
                - iid
                - title
                type: object
              ownerSubjects:
                description: |-
                  OwnerSubjects are the Desk identities (OIDC username claim) that own
                  the milestone, from its "<prefix> owner-subjects …" line. Used to
                  authorize Desk accept/reject of pilot proposals. No project-level
                  or default fallback.
                items:
                  type: string
                type: array
              owners:
                description: |-
                  Owners are the GitLab usernames mentioned when the task needs a human:
                  the milestone's, else the project's, else the operator's default.
                items:
                  type: string
                type: array
              projectRef:
                description: ProjectRef is the name of the AgentProject in the same
                  namespace.
                type: string
              rules:
                description: |-
                  Rules are the standing rules of the milestone: its description's
                  lines "/agent rule R<n>: <kind> <text>" without "/agent rule " (spec
                  and Coordinate tasks).
                items:
                  type: string
                type: array
              runRequest:
                description: |-
                  RunRequest is a monotonically increasing counter. Every increment asks
                  the runner for exactly one more run. The runner acknowledges by setting
                  status.run.observedRunRequest.
                format: int64
                type: integer
              source:
                description: |-
                  Source records which GitLab state the operator has already turned into
                  run requests, so that every change triggers exactly one run.
                properties:
                  autopilotPause:
                    description: |-
                      AutopilotPause is the reason autopilot is paused over this issue
                      (Implement tasks), copied from the milestone's spec task, so a run
                      during the pause knows it. Empty when it is not paused over it.
                    type: string
                  chatAnswers:
                    description: |-
                      ChatAnswers are the operator's answers to Desk chat commands, keyed
                      by message ID. The chatreply reconciler copies them into
                      chat_messages and drops them with their messages. At most 20.
                    items:
                      description: ChatReply is one answer to a ChatMessage.
                      properties:
                        at:
                          format: date-time
                          type: string
                        error:
                          description: |-
                            Error is set when the turn did not finish normally (e.g. "interrupted",
                            "usage limit until <time>").
                          type: string
                        messageID:
                          format: int64
                          type: integer
                        pushedSHA:
                          description: PushedSHA is set when a writable turn committed
                            and pushed.
                          type: string
                        text:
                          description: Text is the agent's answer, made inert and
                            cut to 16 KiB.
                          maxLength: 16384
                          type: string
                      required:
                      - at
                      - messageID
                      type: object
                    maxItems: 20
                    type: array
                  chatContext:
                    description: |-
                      ChatContext is the Desk chat a fresh implementer session gets instead
                      of the comment threads on a project without GitLab input
                      (workflow.inputs [desk]): the task's last answered messages of both
                      sides, oldest first, at most 30 KiB of text. Set by the operator with
                      each run request.
                    items:
                      description: ChatMessage is one Desk chat turn handed to the
                        runner.
                      properties:
                        at:
                          description: At is when the message was written.
                          format: date-time
                          type: string
                        author:
                          description: Author is the OIDC subject.
                          type: string
                        authorName:
                          description: AuthorName is a display name for the prompt.
                          type: string
                        id:
                          description: ID is the chat_messages row id.
                          format: int64
                          type: integer
                        kind:
                          description: |-
                            Kind is message, interrupt or command. The runner skips command;
                            the operator handles those.
                          enum:
                          - message
                          - interrupt
                          - command
                          type: string
                        role:
                          description: |-
                            Role is who wrote a chatContext message: user or agent. Unset on
                            chatMessages, which are the user's.
                          enum:
                          - user
                          - agent
                          type: string
                        text:
                          description: Text is the user's message, at most 16 KiB.
                          maxLength: 16384
                          type: string
                      required:
                      - at
                      - author
                      - id
                      - kind
                      - text
                      type: object
                    maxItems: 20
                    type: array
                  chatMessages:
                    description: |-
                      ChatMessages are Desk chat turns for this task's agent. Written by
                      the operator, answered by the runner, dropped by the operator once
                      the reply is stored. At most 20 queued. Kind "command" rows are
                      applied by the project reconciler, not the runner.
                    items:
                      description: ChatMessage is one Desk chat turn handed to the
                        runner.
                      properties:
                        at:
                          description: At is when the message was written.
                          format: date-time
                          type: string
                        author:
                          description: Author is the OIDC subject.
                          type: string
                        authorName:
                          description: AuthorName is a display name for the prompt.
                          type: string
                        id:
                          description: ID is the chat_messages row id.
                          format: int64
                          type: integer
                        kind:
                          description: |-
                            Kind is message, interrupt or command. The runner skips command;
                            the operator handles those.
                          enum:
                          - message
                          - interrupt
                          - command
                          type: string
                        role:
                          description: |-
                            Role is who wrote a chatContext message: user or agent. Unset on
                            chatMessages, which are the user's.
                          enum:
                          - user
                          - agent
                          type: string
                        text:
                          description: Text is the user's message, at most 16 KiB.
                          maxLength: 16384
                          type: string
                      required:
                      - at
                      - author
                      - id
                      - kind
                      - text
                      type: object
                    maxItems: 20
                    type: array
                  ciFixPipelineID:
                    description: |-
                      CIFixPipelineID is the failed pipeline the operator asked the agent to
                      fix with the latest run request.
                    format: int64
                    type: integer
                  descriptionHash:
                    description: DescriptionHash of the milestone description (Spec
                      tasks).
                    type: string
                  infraRetry:
                    description: |-
                      InfraRetry is the run request the operator made to retry a run that
                      failed for an outside reason (run.blockReason infra), once per run
                      request: a retry that fails the same way waits for a human.
                    format: int64
                    type: integer
                  issueUpdatedAt:
                    description: |-
                      IssueUpdatedAt / MergeRequestUpdatedAt let the operator skip fetching
                      comments when nothing changed.
                    format: date-time
                    type: string
                  lastChatCommandID:
                    description: |-
                      LastChatCommandID is the newest Desk chat command (kind "command")
                      the project reconciler has applied (Implement, Spec autopilot, or
                      Coordinate tasks).
                    format: int64
                    type: integer
                  lastCommandNoteID:
                    description: |-
                      LastCommandNoteID is the newest "/agent" comment that was turned into a
                      run request (Implement tasks).
                    format: int64
                    type: integer
                  lastPilotNoteID:
                    description: |-
                      LastPilotNoteID is the newest comment on the issue or its merge
                      request handed to the pilot (Implement tasks).
                    format: int64
                    type: integer
                  lastRoutingNoteID:
                    description: |-
                      LastRoutingNoteID is the newest "/agent use" or "/agent effort"
                      comment that was applied to the issue's labels (Implement tasks).
                    format: int64
                    type: integer
                  mergeBaseFor:
                    description: |-
                      MergeBaseFor is the merge request head the operator saw conflicting
                      with the default branch. The next run merges the default branch into
                      the work branch and has the agent resolve the conflicts; it is asked
                      once per head.
                    type: string
                  mergeRequestUpdatedAt:
                    format: date-time
                    type: string
                  pilotEvents:
                    description: |-
                      PilotEvents are the events the operator woke the pilot for
                      (Coordinate tasks), each assessed by the run of its request.
                    items:
                      description: |-
                        PilotEvent is something the pilot assesses without being asked: an
                        autopilot pause, an issue that needs input or is blocked by infra or
                        quota, a red or flaky default branch.
                      properties:
                        issueIID:
                          description: IssueIID is the issue it is about, if any.
                          format: int64
                          type: integer
                        key:
                          description: 'Key identifies the event: it wakes the pilot
                            once.'
                          type: string
                        pipelineID:
                          description: PipelineID is the red pipeline it is about,
                            if any.
                          format: int64
                          type: integer
                        request:
                          description: Request is the run request that assesses it.
                          format: int64
                          type: integer
                        text:
                          description: Text says what happened; it can quote titles
                            and GitLab's errors.
                          type: string
                      required:
                      - key
                      - request
                      - text
                      type: object
                    type: array
                  pilotInstruction:
                    description: |-
                      PilotInstruction is an instruction an owner accepted from the pilot
                      (Implement tasks), for the run of its request.
                    properties:
                      kind:
                        type: string
                      note:
                        type: string
                      owner:
                        type: string
                      request:
                        description: Request is the run request it is for.
                        format: int64
                        type: integer
                      text:
                        type: string
                    required:
                    - request
                    type: object
                  pilotMessages:
                    description: |-
                      PilotMessages are the owners' messages to the pilot (Coordinate
                      tasks), each answered by the run of its request.
                    items:
                      description: PilotMessage is a comment addressed to the pilot.
                      properties:
                        author:
                          type: string
                        body:
                          description: Body without the address ("/pilot", the mention).
                          type: string
                        issueIID:
                          description: 'Where it was written: an issue, or a merge
                            request.'
                          format: int64
                          type: integer
                        mergeRequestIID:
                          format: int64
                          type: integer
                        noteID:
                          format: int64
                          type: integer
                        request:
                          description: Request is the run request that answers it.
                          format: int64
                          type: integer
                      required:
                      - author
                      - body
                      - noteID
                      - request
                      type: object
                    type: array
                  pilotRun:
                    description: |-
                      PilotRun is a run request the pilot started (Implement tasks): that
                      run keeps the issue's CI fix rounds (status.run.ciRound), unlike a
                      human's.
                    format: int64
                    type: integer
                  promptAnswers:
                    description: |-
                      PromptAnswers are owners' answers to the implementer's needsInput
                      prompts (Implement tasks). The runner delivers each to the agent's
                      session once, from the run of its request on.
                    items:
                      description: |-
                        PromptAnswerDelivery is an owner's answer to a needsInput prompt of the
                        implementer (Implement tasks), written by the operator after the owner
                        check. The runner hands it to the agent's session as one user turn, once.
                      properties:
                        by:
                          description: By is the owner's username.
                          type: string
                        optionID:
                          description: |-
                            OptionID and OptionLabel are the option the owner chose, empty for an
                            answer in free text only.
                          type: string
                        optionLabel:
                          type: string
                        prompt:
                          description: Prompt is the prompt's id ("Q5").
                          type: string
                        question:
                          description: Question is the prompt's question, as the agent
                            asked it.
                          type: string
                        request:
                          description: Request is the run request that delivers it.
                          format: int64
                          type: integer
                        text:
                          description: Text is the owner's free text.
                          maxLength: 4000
                          type: string
                      required:
                      - prompt
                      - request
                      type: object
                    maxItems: 5
                    type: array
                  promptRefines:
                    description: |-
                      PromptRefines are owners' free-text answers to action prompts
                      (Coordinate tasks), each turned by the pilot's run of its request into
                      one option or one follow-up question (status.pilot.refined).
                    items:
                      description: |-
                        PromptRefine is an owner's free text on an action prompt, handed to the
                        pilot with the prompt: the pilot makes one option of it or asks one
                        follow-up question. Written by the operator.
                      properties:
                        by:
                          description: By is the owner who wrote it.
                          type: string
                        context:
                          type: string
                        messageID:
                          description: MessageID is the Desk chat message of the answer,
                            0 for another.
                          format: int64
                          type: integer
                        options:
                          items:
                            description: PromptOption is one answer an owner can choose.
                            properties:
                              actions:
                                description: |-
                                  Actions run when an owner chooses it, validated like an accepted
                                  proposal's; none: the "do nothing" option.
                                items:
                                  description: |-
                                    PilotAction is one action of a proposal of the pilot; the operator
                                    validates and executes it once an owner accepts the proposal.
                                  properties:
                                    decision:
                                      description: Decision to revisit, e.g. D12-3;
                                        Note is the change asked for.
                                      type: string
                                    issueIID:
                                      format: int64
                                      type: integer
                                    kind:
                                      description: Kind of an instruct, one of PilotInstructKinds.
                                      type: string
                                    note:
                                      description: |-
                                        Note: the pilot's hint to the implementer (instruct), the body of
                                        the issue it opens (openIssue), the change asked for (revisit).
                                        Untrusted.
                                      type: string
                                    owner:
                                      description: |-
                                        Owner and Text: an owner's own words for the implementer ("/pilot
                                        tell #N: …"). Only the operator sets them.
                                      type: string
                                    pipelineID:
                                      description: |-
                                        PipelineID is the red default-branch pipeline whose failed jobs
                                        retryPipeline retries.
                                      format: int64
                                      type: integer
                                    rule:
                                      description: |-
                                        Rule is the ID ("R2") of the standing rule forgetRule removes. A
                                        setRule has its kind (switch, pilot, prompt) in Kind and its text in
                                        Note; a forgetRule the operator's copy of the rule's text in Note.
                                      type: string
                                    spec:
                                      description: |-
                                        Spec is the full new spec text of an editSpec, which replaces the
                                        milestone description except its command lines (markers, owners,
                                        rules). Untrusted until an owner accepts its diff.
                                      type: string
                                    text:
                                      type: string
                                    title:
                                      description: Title of the issue it opens (openIssue).
                                      type: string
                                    tool:
                                      description: |-
                                        Tool: retry, reReview, instruct, openIssue, fixFlaky, retryPipeline,
                                        skip, pause, resume, revisit, setRule, forgetRule or editSpec.
                                      type: string
                                  required:
                                  - tool
                                  type: object
                                type: array
                              detail:
                                description: Detail says what the option does. Untrusted.
                                type: string
                              fromAnswer:
                                description: |-
                                  FromAnswer: the pilot made it from an owner's free text; it follows
                                  the producer's options and waits for the owner to confirm it.
                                type: boolean
                              id:
                                description: ID is "A".."E", in order.
                                type: string
                              label:
                                type: string
                              recommended:
                                type: boolean
                            type: object
                          maxItems: 5
                          type: array
                        prompt:
                          description: Prompt is the prompt's id ("Q3").
                          type: string
                        question:
                          description: |-
                            Question, Context and Options are the prompt's when it was answered.
                            Untrusted.
                          type: string
                        request:
                          description: Request is the run request that refines it.
                          format: int64
                          type: integer
                        text:
                          description: Text is the owner's free text. Untrusted.
                          maxLength: 4000
                          type: string
                      required:
                      - prompt
                      - request
                      - text
                      type: object
                    maxItems: 5
                    type: array
                  retroSpend:
                    description: |-
                      RetroSpend is what the milestone cost, from the history database
                      (agent_calls), set by the operator with Retrospective (Coordinate
                      tasks). Unset without the database or when its query failed: the
                      retrospective sums the live tasks then.
                    properties:
                      costKnown:
                        description: CostKnown is false when no call reported or estimated
                          a cost.
                        type: boolean
                      costUSD:
                        description: CostUSD sums the known costs (4 decimals).
                        type: string
                      subagentCalls:
                        description: SubagentCalls is how often the calls delegated
                          to a subagent.
                        format: int64
                        type: integer
                      tokens:
                        description: SpendTokens are tokens by type.
                        properties:
                          cacheRead:
                            format: int64
                            type: integer
                          cacheWrite:
                            format: int64
                            type: integer
                          input:
                            format: int64
                            type: integer
                          output:
                            format: int64
                            type: integer
                        type: object
                      topIssues:
                        items:
                          description: |-
                            SpendDriver is one issue, kind or model of a SpendSummary: Key is the
                            issue IID, the kind or the model, Label how to name it.
                          properties:
                            costUSD:
                              description: CostUSD is empty when none of its calls
                                has a known cost.
                              type: string
                            key:
                              type: string
                            label:
                              type: string
                            tokens:
                              format: int64
                              type: integer
                          required:
                          - key
                          type: object
                        maxItems: 3
                        type: array
                      topKinds:
                        items:
                          description: |-
                            SpendDriver is one issue, kind or model of a SpendSummary: Key is the
                            issue IID, the kind or the model, Label how to name it.
                          properties:
                            costUSD:
                              description: CostUSD is empty when none of its calls
                                has a known cost.
                              type: string
                            key:
                              type: string
                            label:
                              type: string
                            tokens:
                              format: int64
                              type: integer
                          required:
                          - key
                          type: object
                        maxItems: 3
                        type: array
                      topModels:
                        description: TopModels counts subagent models as their own
                          entries.
                        items:
                          description: |-
                            SpendDriver is one issue, kind or model of a SpendSummary: Key is the
                            issue IID, the kind or the model, Label how to name it.
                          properties:
                            costUSD:
                              description: CostUSD is empty when none of its calls
                                has a known cost.
                              type: string
                            key:
                              type: string
                            label:
                              type: string
                            tokens:
                              format: int64
                              type: integer
                          required:
                          - key
                          type: object
                        maxItems: 3
                        type: array
                    type: object
                  retrospective:
                    description: |-
                      Retrospective is the run request that writes the retrospective of the
                      milestone (Coordinate tasks), once its autopilot is done.
                    format: int64
                    type: integer
                  reviewFor:
                    description: |-
                      ReviewFor is a merge request head to review again without the
                      implementer (after its reviewers failed, or "/agent review"). It is
                      asked once per head; if the branch moved on, the run is a normal one.
                    type: string
                type: object
              suspend:
                description: 'Suspend hibernates the task: its pod is deleted, the
                  workspace is kept.'
                type: boolean
              type:
                description: Type of the task.
                enum:
                - Spec
                - Implement
                - Coordinate
                type: string
            required:
            - projectRef
            - type
            type: object
          status:
            description: |-
              AgentTaskStatus is the observed state of an AgentTask. The top-level fields
              are written by the operator, Run is written by the runner inside the pod.
              Both sides use merge patches so they never overwrite each other.
            properties:
              agentMemoryLimit:
                description: |-
                  AgentMemoryLimit is the agent container's memory limit for this task,
                  raised by the operator after OOM kills (see agents.maxMemory). It
                  applies while it is above the project's limit.
                type: string
              agentTermination:
                description: |-
                  AgentTermination is the last time the agent container stopped while
                  its pod ran (it is restarted in place), e.g. killed for using more than
                  its memory limit. The runner names it when a run loses the agent.
                properties:
                  exitCode:
                    format: int32
                    type: integer
                  finishedAt:
                    format: date-time
                    type: string
                  memoryLimit:
                    description: MemoryLimit of the container, if it has one.
                    type: string
                  reason:
                    description: Reason as the kubelet reports it, e.g. OOMKilled
                      or Error.
                    type: string
                  restarts:
                    description: Restarts of the container in its pod so far.
                    format: int32
                    type: integer
                type: object
              autopilot:
                description: |-
                  Autopilot is the operator's queue of an autopilot milestone (spec
                  tasks).
                properties:
                  budget:
                    description: |-
                      Budget is the milestone's budget and its spend, refreshed every poll
                      while the milestone has a budget line.
                    properties:
                      limitUSD:
                        description: LimitUSD is the budget (spec.budgetUSD).
                        type: string
                      spentUSD:
                        description: |-
                          SpentUSD is the milestone's spend; empty while it cannot be read
                          (no database, or the query failed).
                        type: string
                      warnedAt:
                        description: |-
                          WarnedAt is when the owners were told that 80 % of the budget is
                          spent.
                        format: date-time
                        type: string
                    required:
                    - limitUSD
                    type: object
                  closeWaitsFor:
                    description: |-
                      CloseWaitsFor are the open issues a done milestone was last reported
                      to wait for before autopilot closes it.
                    items:
                      format: int64
                      type: integer
                    type: array
                  items:
                    description: 'Items in queue order: dependencies first, ties in
                      plan order.'
                    items:
                      description: AutopilotItem is one issue in the queue of an autopilot
                        milestone.
                      properties:
                        budget:
                          description: |-
                            Budget is the issue's budget (its implement task's spec.budgetUSD,
                            else the project's budget.perIssueUSD) and its spend, refreshed every
                            poll while the issue has one; warnedAt is unused.
                          properties:
                            limitUSD:
                              description: LimitUSD is the budget (spec.budgetUSD).
                              type: string
                            spentUSD:
                              description: |-
                                SpentUSD is the milestone's spend; empty while it cannot be read
                                (no database, or the query failed).
                              type: string
                            warnedAt:
                              description: |-
