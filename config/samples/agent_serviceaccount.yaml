# Service account for agent pods in the namespace that hosts your AgentProjects.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-operator-agent
  namespace: agents
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ai-operator-agent
  namespace: agents
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ai-operator-agent
subjects:
  - kind: ServiceAccount
    name: ai-operator-agent
    namespace: agents
