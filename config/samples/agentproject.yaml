apiVersion: ai.wiemers.me/v1alpha1
kind: AgentProject
metadata:
  name: shop
  namespace: agents
spec:
  gitlab:
    url: https://gitlab.com
    project: my-group/shop
    tokenSecretRef:
      name: gitlab
      key: token
  milestones:
    # Only milestones whose description contains this marker are planned.
    specMarker: "/agent spec"
  workflow:
    readyLabel: "agent::ready"
    doneLabel: "agent::done"
    commandPrefix: "/agent"
  maxConcurrentRuns: 3
  pollInterval: 1m
  lifecycle:
    idleTimeout: 1h        # keep the pod warm this long after a run
    retentionPeriod: 168h  # then keep the workspace PVC this long (7 days)
    maxRunsPerTask: 20
  agents:
    # Optional: defaults to the agent image of the installed release. Set it
    # to your own image that adds the toolchains your repositories need.
    # image: registry.example.com/my-agent:2026.10.1
    credentialsSecretName: agent-credentials
    workspaceSize: 10Gi
    # cacheClaimName: agent-cache   # optional RWX PVC for shared dependency caches
    resources:
      requests: {cpu: "1", memory: 2Gi}
      limits: {memory: 6Gi}
    # Planning: one run per milestone, worth a strong model.
    spec:
      engine: claude
      model: claude-opus-5-5
      effort: high
    # Issues select a profile with a label, e.g. agent-profile::fast. The spec
    # agent picks one per sub-issue from the descriptions; change the label to
    # override it.
    profiles:
      - name: fast
        description: Small, well-defined changes that follow existing patterns, touch few files and leave no design decisions open.
        engine: cursor
        model: auto
      - name: strong
        description: Everything else - design decisions, cross-cutting or risky changes, unclear scope.
        engine: claude
        model: claude-opus-5-5
        maxBudgetUSD: "10"
        instructions: |
          Run `make test` before finishing.
    # Issues without a profile label (e.g. created by hand).
    implement:
      engine: claude
      model: claude-opus-5-5
    review:
      engine: cursor
      model: auto
      # or: engine: claude, model: claude-sonnet-5-5 (the default)
      reviewers: [bugbot, security]
      maxIterations: 2
