# Create these with real values, e.g.:
#   kubectl -n agents create secret generic gitlab --from-literal=token=glpat-...
#   kubectl -n agents create secret generic agent-credentials \
#     --from-literal=CLAUDE_CODE_OAUTH_TOKEN="$(claude setup-token)" \
#     --from-literal=CURSOR_API_KEY=key_...
apiVersion: v1
kind: Secret
metadata:
  name: gitlab
  namespace: agents
stringData:
  # Project access token, role Developer, scopes: api, write_repository.
  token: REPLACE_ME
---
apiVersion: v1
kind: Secret
metadata:
  name: agent-credentials
  namespace: agents
stringData:
  # Every key becomes an environment variable of the agent pod.
  # Claude subscription (Pro/Max): output of `claude setup-token`.
  CLAUDE_CODE_OAUTH_TOKEN: REPLACE_ME
  # Or bill the Claude API instead:
  # ANTHROPIC_API_KEY: sk-ant-...
  # Cursor subscription, for roles with engine: cursor.
  # CURSOR_API_KEY: REPLACE_ME
