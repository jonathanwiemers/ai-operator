# Permissions of the agent pods (ai-runner). Bind this ClusterRole in every
# namespace that hosts AgentProjects; see config/samples/agent_serviceaccount.yaml.
# The runner reads its own task/project (the pilot also the tasks of its
# milestone) and reports progress in agenttasks/status. It cannot touch
# pods, secrets or task specs.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ai-operator-agent
rules:
  - apiGroups: ["ai.wiemers.me"]
    resources: ["agentprojects"]
    verbs: ["get"]
  # list: the pilot reads the tasks of its milestone.
  - apiGroups: ["ai.wiemers.me"]
    resources: ["agenttasks"]
    verbs: ["get", "list"]
  - apiGroups: ["ai.wiemers.me"]
    resources: ["agenttasks/status"]
    verbs: ["get", "patch"]
  # Research runs (only with a research database) read their AgentResearch
  # and record the outcome in agentresearches/status.
  - apiGroups: ["ai.wiemers.me"]
    resources: ["agentresearches"]
    verbs: ["get"]
  - apiGroups: ["ai.wiemers.me"]
    resources: ["agentresearches/status"]
    verbs: ["get", "patch"]
