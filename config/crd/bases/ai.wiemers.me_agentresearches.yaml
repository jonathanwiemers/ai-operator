---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: agentresearches.ai.wiemers.me
spec:
  group: ai.wiemers.me
  names:
    kind: AgentResearch
    listKind: AgentResearchList
    plural: agentresearches
    shortNames:
    - ar
    singular: agentresearch
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.view
      name: View
      type: string
    - jsonPath: .spec.depth
      name: Depth
      type: string
    - jsonPath: .spec.schedule
      name: Schedule
      type: string
    - jsonPath: .status.lastRun
      name: Last run
      type: date
    - jsonPath: .status.nextRun
      name: Next run
      type: date
    - jsonPath: .status.lastModel
      name: Agent
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          AgentResearch is a research question an agent answers with blocks, once or
          on a schedule; the results are kept in the research database.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: AgentResearchSpec is a research question, run once or on
              a schedule.
            properties:
              agent:
                description: |-
                  Agent fixes the engine and model. Omitted, the operator chooses one
                  from the research candidates of the run's depth.
                properties:
                  effort:
                    description: Effort level (claude engine only).
                    enum:
                    - low
                    - medium
                    - high
                    - xhigh
                    - max
                    type: string
                  engine:
                    description: Engine is the coding agent CLI that runs a role.
                    enum:
                    - claude
                    - cursor
                    type: string
                  model:
                    description: Model passed to the engine, or its alias, e.g. sonnet.
                    minLength: 1
                    type: string
                required:
                - engine
                - model
                type: object
              depth:
                default: quick
                description: |-
                  Depth sets the timeout (quick 20m, deep 2h) and the default agent
                  candidates.
                enum:
                - quick
                - deep
                type: string
              projectRef:
                description: |-
                  ProjectRef names the AgentProject in the same namespace whose
                  credentials, agent image, engines and usage readings the runs use.
                minLength: 1
                type: string
              prompt:
                description: Prompt is the instructions for the agent.
                maxLength: 16384
                minLength: 1
                type: string
              retention:
                default: 720h
                description: Retention is how long the results are kept.
                type: string
              schedule:
                description: |-
                  Schedule is a standard cron expression, e.g. "0 7 * * *". Without one
                  the research runs once.
                type: string
              sources:
                description: |-
                  Sources are feeds (RSS 2.0 or Atom 1.0) the runner reads before each
                  run; their recent entries are given to the agent as data. At most 20.
                items:
                  description: ResearchSource is a feed the runner reads before each
                    run.
                  properties:
                    name:
                      description: Name labels the feed for the agent and in warnings,
                        e.g. "tagesschau Inland".
                      maxLength: 100
                      type: string
                    topic:
                      description: Topic is the topic the feed's entries belong to,
                        when it has one, e.g. "Bundestag".
                      maxLength: 100
                      type: string
                    url:
                      description: URL is the feed's https URL.
                      maxLength: 2048
                      pattern: ^https://
                      type: string
                  required:
                  - url
                  type: object
                maxItems: 20
                type: array
              timeZone:
                description: |-
                  TimeZone is the IANA time zone of the schedule, e.g. Europe/Berlin.
                  Defaults to UTC.
                type: string
              topics:
                description: Topics the results are grouped by, e.g. the sections
                  of a news flash.
                items:
                  maxLength: 100
                  minLength: 1
                  type: string
                maxItems: 20
                type: array
              view:
                default: report
                description: View is how the UI shows the results.
                enum:
                - newsflash
                - report
                type: string
            required:
            - projectRef
            - prompt
            type: object
          status:
            description: AgentResearchStatus is written by the operator and the runner.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              lastEngine:
                description: LastEngine and LastModel ran the last run.
                enum:
                - claude
                - cursor
                type: string
              lastModel:
                type: string
              lastResultID:
                description: LastResultID is the stored result of the last successful
                  run.
                type: string
              lastRun:
                description: LastRun is when the last run started.
                format: date-time
                type: string
              nextRun:
                description: NextRun is when the next scheduled run starts.
                format: date-time
                type: string
              observedGeneration:
                format: int64
                type: integer
              phase:
                description: ResearchPhase is where a research stands.
                enum:
                - Scheduled
                - Running
                - Waiting
                - Succeeded
                - Failed
                type: string
              run:
                description: Run is the current or last run.
                properties:
                  calls:
                    description: |-
                      Calls are the run's engine calls, seq 1..n, as the runner reported
                      them; the operator writes them to the history when the run finishes.
                    items:
                      description: 'AgentCall is one engine call: what ran, for what,
                        and what it consumed.'
                      properties:
                        at:
                          description: At is when the call started.
                          format: date-time
                          type: string
                        cacheReadTokens:
                          format: int64
                          type: integer
                        cacheWriteTokens:
                          format: int64
                          type: integer
                        contextSeries:
                          description: |-
                            ContextSeries is the context size (input and cache tokens) of each
                            main-thread assistant turn. Only the newest calls in status keep it.
                          items:
                            format: int64
                            type: integer
                          maxItems: 500
                          type: array
                          x-kubernetes-list-type: atomic
                        costSource:
                          description: |-
                            CostSource says where CostUSD comes from: reported by the engine,
                            estimated from tokens, or unknown.
                          type: string
                        costUSD:
                          description: |-
                            CostUSD is the call's cost as a decimal string (4 decimals); empty
                            when it is unknown.
                          type: string
                        durationMS:
                          format: int64
                          type: integer
                        effort:
                          type: string
                        engine:
                          description: Engine is the coding agent CLI that runs a
                            role.
                          enum:
                          - claude
                          - cursor
                          type: string
                        fallbackFrom:
                          description: FallbackFrom is the limited engine this call
                            stood in for.
                          enum:
                          - claude
                          - cursor
                          type: string
                        inputTokens:
                          format: int64
                          type: integer
                        kind:
                          description: |-
                            Kind is what the call was for: spec, implement, review, fix, ci,
                            conflict, describe, pilot, retro, chat or research.
                          type: string
                        model:
                          description: |-
                            Model is the configured model, or the reported main model when the
                            engine picked it.
                          type: string
                        models:
                          description: |-
                            Models is the per-model split as the engine reported it, subagent
                            models included.
                          items:
                            description: CallModelUsage is one model's share of an
                              agent call.
                            properties:
                              cacheReadTokens:
                                format: int64
                                type: integer
                              cacheWriteTokens:
                                format: int64
                                type: integer
                              costUSD:
                                description: CostUSD as a decimal string (4 decimals).
                                type: string
                              inputTokens:
                                format: int64
                                type: integer
                              model:
                                type: string
                              outputTokens:
                                format: int64
                                type: integer
                            required:
                            - model
                            type: object
                          type: array
                          x-kubernetes-list-type: atomic
                        outputTokens:
                          format: int64
                          type: integer
                        resumed:
                          description: Resumed is set when the call continued an earlier
                            session.
                          type: boolean
                        role:
                          description: Role is the agent's role, e.g. implement, bugbot
                            or pilot.
                          type: string
                        run:
                          description: Run is the task's run (RunCount after it) the
                            call belongs to.
                          format: int64
                          type: integer
                        seq:
                          description: Seq numbers the task's calls, starting at 1.
                          format: int64
                          type: integer
                        subagentCalls:
                          description: SubagentCalls is how many subagents the call
                            started.
                          format: int32
                          type: integer
                        subagentTurns:
                          description: |-
                            SubagentTurns are the indexes into ContextSeries after which a
                            subagent ran. Only the newest calls in status keep them.
                          items:
                            format: int32
                            type: integer
                          maxItems: 500
                          type: array
                          x-kubernetes-list-type: atomic
                        turns:
                          format: int32
                          type: integer
                      required:
                      - at
                      - costSource
                      - engine
                      - kind
                      - seq
                      type: object
                    maxItems: 50
                    type: array
                    x-kubernetes-list-type: atomic
                  costUSD:
                    description: CostUSD is the model spend of the run, as a decimal
                      string.
                    type: string
                  effort:
                    type: string
                  engine:
                    description: Engine is the coding agent CLI that runs a role.
                    enum:
                    - claude
                    - cursor
                    type: string
                  engineUsage:
                    description: |-
                      EngineUsage is the newest usage reading per engine of this run; the
                      project collects it like a task's.
                    items:
                      description: |-
                        EngineUsage is what an engine last said about its usage windows (claude
                        reports them with every call; cursor reports none).
                      properties:
                        engine:
                          description: Engine is the coding agent CLI that runs a
                            role.
                          enum:
                          - claude
                          - cursor
                          type: string
                        observedAt:
                          description: ObservedAt is when the engine reported it.
                          format: date-time
                          type: string
                        status:
                          description: |-
                            Status as the engine reports it, e.g. allowed, allowed_warning or
                            rejected.
                          type: string
                        windows:
                          description: Windows are the engine's usage windows, e.g.
                            five_hour and seven_day.
                          items:
                            description: UsageWindow is how much of one usage window
                              is used.
                            properties:
                              name:
                                type: string
                              percent:
                                description: Percent of the window that is used.
                                format: int32
                                type: integer
                              resetsAt:
                                description: ResetsAt is when the window starts over.
                                format: date-time
                                type: string
                            required:
                            - name
                            - percent
                            type: object
                          type: array
                      required:
                      - engine
                      - observedAt
                      type: object
                    type: array
                  finishedAt:
                    description: FinishedAt is set by the operator once it recorded
                      the outcome.
                    format: date-time
                    type: string
                  id:
                    description: ID of the run in the research store.
                    type: string
                  message:
                    type: string
                  model:
                    type: string
                  outcome:
                    description: |-
                      ResearchOutcome is how a run ended: degraded means the answer failed
                      validation and was stored as plain markdown; limited means it hit a usage
                      limit.
                    enum:
                    - succeeded
                    - degraded
                    - failed
                    - limited
                    type: string
                  reason:
                    description: |-
                      Reason says why this agent was chosen, e.g. "chosen: cursor/auto
                      (sonnet: 5-hour window at 85 %)".
                    type: string
                  startedAt:
                    format: date-time
                    type: string
                  usageLimits:
                    description: UsageLimits the run hit.
                    items:
                      description: UsageLimit is an engine's active usage or rate
                        limit.
                      properties:
                        deferred:
                          description: |-
                            Deferred marks, in a task's status.run.usageLimits, the limit that
                            deferred the run (see status.run.deferredUntil for the retry time).
                          type: boolean
                        engine:
                          description: Engine is the coding agent CLI that runs a
                            role.
                          enum:
                          - claude
                          - cursor
                          type: string
                        message:
                          description: Message reported by the engine.
                          type: string
                        until:
                          format: date-time
                          type: string
                      required:
                      - engine
                      - until
                      type: object
                    type: array
                type: object
              skippedReason:
                description: |-
                  SkippedReason says why the last scheduled run was skipped, e.g. which
                  agent was limited until when.
                type: string
              waiting:
                description: Waiting is set while a run waits for an engine's usage
                  to reset.
                properties:
                  engine:
                    description: Engine is the coding agent CLI that runs a role.
                    enum:
                    - claude
                    - cursor
                    type: string
                  until:
                    format: date-time
                    type: string
                required:
                - engine
                - until
                type: object
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
