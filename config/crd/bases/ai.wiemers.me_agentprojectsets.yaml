---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: agentprojectsets.ai.wiemers.me
spec:
  group: ai.wiemers.me
  names:
    kind: AgentProjectSet
    listKind: AgentProjectSetList
    plural: agentprojectsets
    shortNames:
    - aps
    singular: agentprojectset
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.gitlab.group
      name: Group
      type: string
    - jsonPath: .status.counts.active
      name: Active
      type: integer
    - jsonPath: .status.counts.dormant
      name: Dormant
      type: integer
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.lastDiscoveryTime
      name: Last Discovery
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: AgentProjectSet makes the operator work in the projects of a
          GitLab group.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              AgentProjectSetSpec makes the operator work in every project of a GitLab
              group that the include globs match and the exclude globs do not: the set
              writes one child AgentProject per active project from its template.
            properties:
              dormantAfter:
                default: 168h
                description: |-
                  DormantAfter is how long a child stays without work (no milestone
                  with the spec marker, no ready issue, no AgentTask) before the set
                  removes it.
                type: string
              exclude:
                description: |-
                  Exclude are path globs of projects the set never works in, whatever
                  Include says, e.g. "my-group/archived/**".
                items:
                  type: string
                type: array
              gitlab:
                description: |-
                  GitLab is the instance, token and root group the set discovers
                  projects in.
                properties:
                  group:
                    description: |-
                      Group is the full path of the root group, e.g. "my-group". The set
                      discovers the projects of the group and its subgroups.
                    minLength: 1
                    type: string
                  tokenSecretRef:
                    description: |-
                      TokenSecretRef points to an access token with the api and
                      write_repository scopes in every project of the group. The set's
                      children use it too.
                    properties:
                      key:
                        description: The key of the secret to select from.  Must be
                          a valid secret key.
                        type: string
                      name:
                        default: ""
                        description: |-
                          Name of the referent.
                          This field is effectively required, but due to backwards compatibility is
                          allowed to be empty. Instances of this type with an empty value here are
                          almost certainly wrong.
                          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                        type: string
                      optional:
                        description: Specify whether the Secret or its key must be
                          defined
                        type: boolean
                    required:
                    - key
                    type: object
                    x-kubernetes-map-type: atomic
                  url:
                    default: https://gitlab.com
                    description: URL of the GitLab instance, e.g. https://gitlab.com.
                    type: string
                required:
                - group
                - tokenSecretRef
                type: object
              include:
                description: |-
                  Include are path globs of the projects the set works in, e.g.
                  "my-group/**": `*` matches within one path segment, `**` across
                  segments, case-insensitive.
                items:
                  type: string
                minItems: 1
                type: array
              pollInterval:
                default: 2m
                description: PollInterval is how often the set discovers the group's
                  projects.
                type: string
              template:
                description: |-
                  Template is the spec of every child AgentProject: any AgentProject
                  spec field except gitlab, which the set fills in from its own gitlab
                  and the project's path. Unknown fields make the set Ready=False,
                  reason InvalidTemplate. The template needs webhook.enabled,
                  webhook.secretRef and webhook.url (reason WebhookRequired).
                type: object
                x-kubernetes-preserve-unknown-fields: true
            required:
            - gitlab
            - include
            type: object
          status:
            description: AgentProjectSetStatus is what the set's last discovery found.
            properties:
              complexity:
                description: |-
                  ProjectSetComplexity is the GraphQL query complexity of the last
                  discovery: the set is Ready=False, reason TooComplex, near the limit.
                properties:
                  limit:
                    format: int32
                    type: integer
                  score:
                    format: int32
                    type: integer
                required:
                - limit
                - score
                type: object
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              counts:
                description: ProjectSetCounts counts the set's projects by state.
                properties:
                  active:
                    format: int32
                    type: integer
                  dormant:
                    format: int32
                    type: integer
                  excluded:
                    format: int32
                    type: integer
                  explicit:
                    format: int32
                    type: integer
                  nameTaken:
                    format: int32
                    type: integer
                type: object
              droppedTargets:
                description: |-
                  DroppedTargets are template crossRepo targets the set's exclude
                  matches: the set drops them from its children.
                items:
                  type: string
                type: array
              lastDiscoveryTime:
                description: LastDiscoveryTime is when the set last listed the group's
                  projects.
                format: date-time
                type: string
              observedGeneration:
                format: int64
                type: integer
              projects:
                description: Projects are the projects include matched, with their
                  state.
                items:
                  description: ProjectSetEntry is one project the set's include matched.
                  properties:
                    child:
                      description: Child is the name of the child AgentProject, if
                        there is one.
                      type: string
                    lastActiveTime:
                      description: LastActiveTime is when the set last saw work in
                        the project.
                      format: date-time
                      type: string
                    milestones:
                      description: |-
                        Milestones is a hash of the project's active milestones (iid, title,
                        updatedAt): a change wakes the child.
                      type: string
                    path:
                      description: Path is the project's full path.
                      type: string
                    reason:
                      description: |-
                        Reason says why the project is in its state, e.g. "archived",
                        "matches exclude my-group/archived/**" or "watched by AgentProject
                        agents/foo".
                      type: string
                    state:
                      description: ProjectSetState is what the set does with a matched
                        project.
                      enum:
                      - active
                      - dormant
                      - excluded
                      - explicit
                      - nameTaken
                      type: string
                  required:
                  - path
                  - state
                  type: object
                type: array
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
