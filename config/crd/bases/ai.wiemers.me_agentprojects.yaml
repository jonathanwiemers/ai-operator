                        description: Specify whether the Secret or its key must be
                          defined
                        type: boolean
                    required:
                    - key
                    type: object
                    x-kubernetes-map-type: atomic
                  url:
                    default: https://gitlab.com
                    description: URL of the GitLab instance, e.g. https://gitlab.com.
                    type: string
                required:
                - project
                - tokenSecretRef
                type: object
              lifecycle:
                description: Lifecycle controls how long agent pods and workspaces
                  are kept around.
                properties:
                  idleTimeout:
                    default: 1h
                    description: IdleTimeout after which an idle pod is deleted while
                      its workspace is kept.
                    type: string
                  maxRunsPerTask:
                    default: 20
                    description: MaxRunsPerTask is a safety net against runaway loops.
                    format: int32
                    type: integer
                  maxUsageLimitBackoff:
                    default: 1h
                    description: MaxUsageLimitBackoff caps the wait between retries.
                    type: string
                  retentionPeriod:
                    default: 168h
                    description: |-
                      RetentionPeriod after the last activity after which the workspace PVC is
                      deleted as well.
                    type: string
                  usageLimitBackoff:
                    default: 5m
                    description: |-
                      UsageLimitBackoff is the first wait after an engine reports a usage or
                      rate limit without saying when it resets. It doubles with every
                      further deferral of the same run, up to MaxUsageLimitBackoff.
                    type: string
                type: object
              maxConcurrentRuns:
                default: 3
                description: |-
                  MaxConcurrentRuns limits how many agent runs (i.e. token-consuming work)
                  may be in flight for this project at the same time. Further runs queue.
                format: int32
                minimum: 1
                type: integer
              milestones:
                description: Milestones selects which milestones get a spec agent.
                properties:
                  specMarker:
                    default: /agent spec
                    description: |-
                      SpecMarker must appear in the milestone description for it to be picked
                      up. This keeps existing milestones from being planned by accident. Set it
                      to an empty string to plan every active milestone with a description.
                    type: string
                  titlePattern:
                    description: TitlePattern is an optional regular expression milestone
                      titles must match.
                    type: string
                type: object
              pollInterval:
                default: 1m
                description: PollInterval is how often GitLab is polled for changes.
                type: string
              suspend:
                description: |-
                  Suspend stops polling GitLab and starting new runs. Existing pods are
                  left alone and are still subject to the lifecycle timeouts.
                type: boolean
              workflow:
                description: Workflow defines the labels that drive the issue state
                  machine.
                properties:
                  assignBot:
                    default: true
                    description: |-
                      AssignBot assigns the bot user to an issue when the operator picks it up
                      and the issue has no assignee, so GitLab's milestone page lists it as
                      ongoing. A human assignee is never replaced.
                    type: boolean
                  commandPrefix:
                    default: /agent
                    description: |-
                      CommandPrefix: a comment on the issue or its merge request that starts
                      with this prefix triggers another agent run (e.g. "/agent please also
                      cover the error case"). Plain discussion does not trigger runs, so no
                      tokens are spent on chatter.
                    type: string
                  doneLabel:
                    default: agent::done
                    description: |-
                      DoneLabel (or closing the issue) ends the task and deletes its pod and
                      workspace.
                    type: string
                  draftLabel:
                    default: agent::draft
                    description: |-
                      DraftLabel is put on issues created by the spec agent. Draft issues are
                      not worked on until a human moves them to ReadyLabel.
                    type: string
                  generatedLabel:
                    default: ai-generated
                    description: GeneratedLabel is added to every issue the spec agent
                      creates.
                    type: string
                  needsInputLabel:
                    default: agent::needs-input
                    description: |-
                      NeedsInputLabel is set by the agent when it has questions it cannot
                      resolve on its own.
                    type: string
                  profileLabelPrefix:
                    default: 'agent-profile::'
                    description: |-
                      ProfileLabelPrefix: an issue labelled "<prefix><profile name>" is
                      implemented with that agent profile (see agents.profiles). The spec agent
                      sets one on every issue it creates; change the label to override its
                      choice. Issues without a profile label use agents.implement.
                    type: string
                  readyLabel:
                    default: agent::ready
                    description: ReadyLabel is set by a human to hand an issue to
                      the implementing agent.
                    type: string
                  reviewLabel:
                    default: agent::review
                    description: ReviewLabel is set by the agent once a merge request
                      is ready for a human.
                    type: string
                  workingLabel:
                    default: agent::working
                    description: WorkingLabel is set by the operator once it has picked
                      up a ready issue.
                    type: string
                type: object
            required:
            - agents
            - gitlab
            type: object
          status:
            description: AgentProjectStatus is the observed state of an AgentProject.
            properties:
              activeMilestones:
                description: ActiveMilestones is the number of milestones currently
                  tracked.
                format: int32
                type: integer
              activeTasks:
                description: ActiveTasks is the number of AgentTasks belonging to
                  this project.
                format: int32
                type: integer
              botUserID:
                description: |-
                  BotUserID is the GitLab user behind the token. Its comments never
                  trigger runs.
                format: int64
                type: integer
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              lastSyncTime:
                description: LastSyncTime is when GitLab was last polled successfully.
                format: date-time
                type: string
              usageLimits:
                description: |-
                  UsageLimits lists engines that currently hit a usage or rate limit.
                  Runs that need such an engine wait instead of hitting the limit again;
                  limits belong to the credentials, so they apply to the whole project.
                items:
                  description: UsageLimit is an engine's active usage or rate limit.
                  properties:
                    engine:
                      description: Engine is the coding agent CLI that runs a role.
                      enum:
                      - claude
                      - cursor
                      type: string
                    message:
                      description: Message reported by the engine.
                      type: string
                    until:
                      format: date-time
                      type: string
                  required:
                  - engine
                  - until
                  type: object
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
