                          type: string
                      required:
                      - at
                      - issueIID
                      type: object
                    type: array
                  issueIID:
                    description: IssueIID is the open issue that reports the red default
                      branch.
                    format: int64
                    type: integer
                  pipelineID:
                    format: int64
                    type: integer
                  reportedJobs:
                    description: ReportedJobs are the failing jobs the issue reports
                      last.
                    items:
                      type: string
                    type: array
                  retriedJobIDs:
                    description: |-
                      RetriedJobIDs are the failed jobs of the retried pipeline, in the
                      order of FailedJobs: the retry replaces them, so their logs are read
                      by ID once the retry is green.
                    items:
                      format: int64
                      type: integer
                    type: array
                  retriedPipelineID:
                    description: RetriedPipelineID is the pipeline whose failed jobs
                      were retried.
                    format: int64
                    type: integer
                  sha:
                    type: string
                  since:
                    description: Since is when the state last changed.
                    format: date-time
                    type: string
                  state:
                    description: MainHealthState is the health of the default branch.
                    enum:
                    - green
                    - retrying
                    - red
                    - flaky
                    type: string
                required:
                - state
                type: object
              usageLimits:
                description: |-
                  UsageLimits lists engines that currently hit a usage or rate limit.
                  Runs that need such an engine wait instead of hitting the limit again;
                  limits belong to the credentials, so they apply to the whole project.
                items:
                  description: UsageLimit is an engine's active usage or rate limit.
                  properties:
                    engine:
                      description: Engine is the coding agent CLI that runs a role.
                      enum:
                      - claude
                      - cursor
                      type: string
                    message:
                      description: Message reported by the engine.
                      type: string
                    until:
                      format: date-time
                      type: string
                  required:
                  - engine
                  - until
                  type: object
                type: array
              webhook:
                description: |-
                  Webhook is the project hook the operator registered and the last
                  delivery.
                properties:
                  checkedAt:
                    description: CheckedAt is when the hook was last checked in GitLab.
                    format: date-time
                    type: string
                  configHash:
                    description: |-
                      ConfigHash is a hash of the settings last registered (URL, events, SSL
                      verification, a hash of the secret), so a change is noticed without
                      asking GitLab.
                    type: string
                  hookID:
                    description: HookID is the hook's ID in GitLab.
                    format: int64
                    type: integer
                  lastDeliveryTime:
                    description: |-
                      LastDeliveryTime is when the last valid delivery for this project
                      arrived. The operator keeps it in memory: after a restart this shows
                      the last one seen before, and the project is polled fully until the
                      next delivery.
                    format: date-time
                    type: string
                type: object
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
