---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: agenttasks.ai.wiemers.me
spec:
  group: ai.wiemers.me
  names:
    kind: AgentTask
    listKind: AgentTaskList
    plural: agenttasks
    shortNames:
    - at
    singular: agenttask
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.type
      name: Type
      type: string
    - jsonPath: .spec.issue.iid
      name: Issue
      type: integer
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.run.currentStep
      name: Step
      type: string
    - jsonPath: .status.run.lastResult
      name: Result
      type: string
    - jsonPath: .status.run.runCount
      name: Runs
      type: integer
    - jsonPath: .status.run.costUSD
      name: Cost
      type: string
    - jsonPath: .status.ci.state
      name: CI
      type: string
    - jsonPath: .status.run.deferredUntil
      name: Retry
      priority: 1
      type: date
    - jsonPath: .status.run.mergeRequestURL
      name: MR
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          AgentTask is one unit of agent work: planning a milestone or implementing
          an issue. It owns the agent pod and the workspace PVC.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              AgentTaskSpec is the desired state of an AgentTask. It is owned by the
              operator: the project controller creates tasks and bumps RunRequest
              whenever GitLab asks for (more) work.
            properties:
              autopilot:
                description: |-
                  Autopilot is set for tasks of autopilot milestones: the agents must
                  not ask questions but take their defaults and record them.
                type: boolean
              issue:
                description: |-
                  Issue implemented by this task (Implement tasks), or the tracking
                  issue the pilot listens on (Coordinate tasks).
                properties:
                  id:
                    format: int64
                    type: integer
                  iid:
                    format: int64
                    type: integer
                  title:
                    type: string
                  webURL:
                    type: string
                required:
                - id
                - iid
                - title
                type: object
              milestone:
                description: Milestone the task belongs to.
                properties:
                  id:
                    format: int64
                    type: integer
                  iid:
                    format: int64
                    type: integer
                  title:
                    type: string
                required:
                - id
                - iid
                - title
                type: object
              ownerSubjects:
                description: |-
                  OwnerSubjects are the Desk identities (OIDC username claim) that own
                  the milestone, from its "<prefix> owner-subjects …" line. Used to
                  authorize Desk accept/reject of pilot proposals. No project-level
                  or default fallback.
                items:
                  type: string
                type: array
              owners:
                description: |-
                  Owners are the GitLab usernames mentioned when the task needs a human:
                  the milestone's, else the project's, else the operator's default.
                items:
                  type: string
                type: array
              projectRef:
                description: ProjectRef is the name of the AgentProject in the same
                  namespace.
                type: string
              rules:
                description: |-
                  Rules are the standing rules of the milestone: its description's
                  lines "/agent rule R<n>: <kind> <text>" without "/agent rule " (spec
                  and Coordinate tasks).
                items:
                  type: string
                type: array
              runRequest:
                description: |-
                  RunRequest is a monotonically increasing counter. Every increment asks
                  the runner for exactly one more run. The runner acknowledges by setting
                  status.run.observedRunRequest.
                format: int64
                type: integer
              source:
                description: |-
                  Source records which GitLab state the operator has already turned into
                  run requests, so that every change triggers exactly one run.
                properties:
                  autopilotPause:
                    description: |-
                      AutopilotPause is the reason autopilot is paused over this issue
                      (Implement tasks), copied from the milestone's spec task, so a run
                      during the pause knows it. Empty when it is not paused over it.
                    type: string
                  chatAnswers:
                    description: |-
                      ChatAnswers are the operator's answers to Desk chat commands, keyed
                      by message ID. The chatreply reconciler copies them into
                      chat_messages and drops them with their messages. At most 20.
                    items:
                      description: ChatReply is one answer to a ChatMessage.
                      properties:
                        at:
                          format: date-time
                          type: string
                        error:
                          description: |-
                            Error is set when the turn did not finish normally (e.g. "interrupted",
                            "usage limit until <time>").
                          type: string
                        messageID:
                          format: int64
                          type: integer
                        pushedSHA:
                          description: PushedSHA is set when a writable turn committed
                            and pushed.
                          type: string
                        text:
                          description: Text is the agent's answer, made inert and
                            cut to 16 KiB.
                          maxLength: 16384
                          type: string
                      required:
                      - at
                      - messageID
                      type: object
                    maxItems: 20
                    type: array
                  chatMessages:
                    description: |-
                      ChatMessages are Desk chat turns for this task's agent. Written by
                      the operator, answered by the runner, dropped by the operator once
                      the reply is stored. At most 20 queued. Kind "command" rows are
                      applied by the project reconciler, not the runner.
                    items:
                      description: ChatMessage is one Desk chat turn handed to the
                        runner.
                      properties:
                        at:
                          description: At is when the message was written.
                          format: date-time
                          type: string
                        author:
                          description: Author is the OIDC subject.
                          type: string
                        authorName:
                          description: AuthorName is a display name for the prompt.
                          type: string
                        id:
                          description: ID is the chat_messages row id.
                          format: int64
                          type: integer
                        kind:
                          description: |-
                            Kind is message, interrupt or command. The runner skips command;
                            the operator handles those.
                          enum:
                          - message
                          - interrupt
                          - command
                          type: string
                        text:
                          description: Text is the user's message, at most 16 KiB.
                          maxLength: 16384
                          type: string
                      required:
                      - at
                      - author
                      - id
                      - kind
                      - text
                      type: object
                    maxItems: 20
                    type: array
                  ciFixPipelineID:
                    description: |-
                      CIFixPipelineID is the failed pipeline the operator asked the agent to
                      fix with the latest run request.
                    format: int64
                    type: integer
                  descriptionHash:
                    description: DescriptionHash of the milestone description (Spec
                      tasks).
                    type: string
                  infraRetry:
                    description: |-
                      InfraRetry is the run request the operator made to retry a run that
                      failed for an outside reason (run.blockReason infra), once per run
                      request: a retry that fails the same way waits for a human.
                    format: int64
                    type: integer
                  issueUpdatedAt:
                    description: |-
                      IssueUpdatedAt / MergeRequestUpdatedAt let the operator skip fetching
                      comments when nothing changed.
                    format: date-time
                    type: string
                  lastChatCommandID:
                    description: |-
                      LastChatCommandID is the newest Desk chat command (kind "command")
                      the project reconciler has applied (Implement, Spec autopilot, or
                      Coordinate tasks).
                    format: int64
                    type: integer
                  lastCommandNoteID:
                    description: |-
                      LastCommandNoteID is the newest "/agent" comment that was turned into a
                      run request (Implement tasks).
                    format: int64
                    type: integer
                  lastPilotNoteID:
                    description: |-
                      LastPilotNoteID is the newest comment on the issue or its merge
                      request handed to the pilot (Implement tasks).
                    format: int64
                    type: integer
                  lastRoutingNoteID:
                    description: |-
                      LastRoutingNoteID is the newest "/agent use" or "/agent effort"
                      comment that was applied to the issue's labels (Implement tasks).
                    format: int64
                    type: integer
                  mergeBaseFor:
                    description: |-
                      MergeBaseFor is the merge request head the operator saw conflicting
                      with the default branch. The next run merges the default branch into
                      the work branch and has the agent resolve the conflicts; it is asked
                      once per head.
                    type: string
                  mergeRequestUpdatedAt:
                    format: date-time
                    type: string
                  pilotEvents:
                    description: |-
                      PilotEvents are the events the operator woke the pilot for
                      (Coordinate tasks), each assessed by the run of its request.
                    items:
                      description: |-
                        PilotEvent is something the pilot assesses without being asked: an
                        autopilot pause, an issue that needs input or is blocked by infra or
                        quota, a red or flaky default branch.
                      properties:
                        issueIID:
                          description: IssueIID is the issue it is about, if any.
                          format: int64
                          type: integer
                        key:
                          description: 'Key identifies the event: it wakes the pilot
                            once.'
                          type: string
                        pipelineID:
                          description: PipelineID is the red pipeline it is about,
                            if any.
                          format: int64
                          type: integer
                        request:
                          description: Request is the run request that assesses it.
                          format: int64
                          type: integer
                        text:
                          description: Text says what happened; it can quote titles
                            and GitLab's errors.
                          type: string
                      required:
                      - key
                      - request
                      - text
                      type: object
                    type: array
                  pilotInstruction:
                    description: |-
                      PilotInstruction is an instruction an owner accepted from the pilot
                      (Implement tasks), for the run of its request.
                    properties:
                      kind:
                        type: string
                      note:
                        type: string
                      owner:
                        type: string
                      request:
                        description: Request is the run request it is for.
                        format: int64
                        type: integer
                      text:
                        type: string
                    required:
                    - request
                    type: object
                  pilotMessages:
                    description: |-
                      PilotMessages are the owners' messages to the pilot (Coordinate
                      tasks), each answered by the run of its request.
                    items:
                      description: PilotMessage is a comment addressed to the pilot.
                      properties:
                        author:
                          type: string
                        body:
                          description: Body without the address ("/pilot", the mention).
                          type: string
                        issueIID:
                          description: 'Where it was written: an issue, or a merge
                            request.'
                          format: int64
                          type: integer
                        mergeRequestIID:
                          format: int64
                          type: integer
                        noteID:
                          format: int64
                          type: integer
                        request:
                          description: Request is the run request that answers it.
                          format: int64
                          type: integer
                      required:
                      - author
                      - body
                      - noteID
                      - request
                      type: object
                    type: array
                  pilotRun:
                    description: |-
                      PilotRun is a run request the pilot started (Implement tasks): that
                      run keeps the issue's CI fix rounds (status.run.ciRound), unlike a
                      human's.
                    format: int64
                    type: integer
                  retrospective:
                    description: |-
                      Retrospective is the run request that writes the retrospective of the
                      milestone (Coordinate tasks), once its autopilot is done.
                    format: int64
                    type: integer
                  reviewFor:
                    description: |-
                      ReviewFor is a merge request head to review again without the
                      implementer (after its reviewers failed, or "/agent review"). It is
                      asked once per head; if the branch moved on, the run is a normal one.
                    type: string
                type: object
              suspend:
                description: 'Suspend hibernates the task: its pod is deleted, the
                  workspace is kept.'
                type: boolean
              type:
                description: Type of the task.
                enum:
                - Spec
                - Implement
                - Coordinate
                type: string
            required:
            - projectRef
            - type
            type: object
          status:
            description: |-
              AgentTaskStatus is the observed state of an AgentTask. The top-level fields
              are written by the operator, Run is written by the runner inside the pod.
              Both sides use merge patches so they never overwrite each other.
            properties:
              agentMemoryLimit:
                description: |-
                  AgentMemoryLimit is the agent container's memory limit for this task,
                  raised by the operator after OOM kills (see agents.maxMemory). It
                  applies while it is above the project's limit.
                type: string
              agentTermination:
                description: |-
                  AgentTermination is the last time the agent container stopped while
                  its pod ran (it is restarted in place), e.g. killed for using more than
                  its memory limit. The runner names it when a run loses the agent.
                properties:
                  exitCode:
                    format: int32
                    type: integer
                  finishedAt:
                    format: date-time
                    type: string
                  memoryLimit:
                    description: MemoryLimit of the container, if it has one.
                    type: string
                  reason:
                    description: Reason as the kubelet reports it, e.g. OOMKilled
                      or Error.
                    type: string
                  restarts:
                    description: Restarts of the container in its pod so far.
                    format: int32
                    type: integer
                type: object
              autopilot:
                description: |-
                  Autopilot is the operator's queue of an autopilot milestone (spec
                  tasks).
                properties:
                  closeWaitsFor:
                    description: |-
                      CloseWaitsFor are the open issues a done milestone was last reported
                      to wait for before autopilot closes it.
                    items:
                      format: int64
                      type: integer
                    type: array
                  items:
                    description: 'Items in queue order: dependencies first, ties in
                      plan order.'
                    items:
                      description: AutopilotItem is one issue in the queue of an autopilot
                        milestone.
                      properties:
                        decisions:
                          description: |-
                            Decisions recorded on the issue, collected when it was merged: the
                            newest 20; the full history is in the history database.
                          items:
                            description: DecisionRef points to a decision recorded
                              on an issue.
                            properties:
                              id:
                                type: string
                              superseded:
                                type: boolean
                              title:
                                type: string
                              url:
                                type: string
                            required:
                            - id
                            type: object
                          type: array
                        flakyFix:
                          description: |-
                            FlakyFix is set for a flaky job's issue handed to the agent
                            (fixFlaky, mainHealth.autoFixFlaky): not in the plan, it stays on a
                            re-plan.
                          type: boolean
                        iid:
                          format: int64
                          type: integer
                        markedReady:
                          description: |-
                            MarkedReady is set once the operator marked the draft MR ready, or
                            found it ready, to run CI. A draft again after that is a human holding
                            it, or a run that left problems.
                          type: boolean
                        mergeRequestIID:
                          description: MergeRequestIID and MergeRequestURL of the
                            issue's merge request.
                          format: int64
                          type: integer
                        mergeRequestURL:
                          type: string
                        mergedSHA:
                          description: MergedSHA is the commit the merge request was
                            merged as.
                          type: string
                        rebasedAt:
                          description: RebasedAt is when the rebase was requested.
                          format: date-time
                          type: string
                        rebasedDiff:
                          description: |-
                            RebasedDiff is a hash of the reviewed change, taken before the rebase.
                            The rebased head is only treated as reviewed if its change hashes the
                            same, i.e. the rebase moved the change without changing it.
                          type: string
                        rebasedFrom:
                          description: |-
                            RebasedFrom is the head the operator asked GitLab to rebase; set
                            while the rebase is in progress.
                          type: string
                        rebases:
                          description: Rebases counts the rebases of this item; only
                            one is attempted.
                          format: int32
                          type: integer
                        revisitOf:
                          description: |-
                            RevisitOf is set for follow-up issues the operator created to revisit
                            a decision of a merged issue: the decision's ID.
                          type: string
                        state:
                          description: AutopilotItemState is the state of one issue
                            in the queue.
                          enum:
                          - Pending
                          - Active
                          - Merged
                          - Skipped
                          type: string
                      required:
                      - iid
                      - state
                      type: object
                    type: array
                  lastCommandNoteID:
                    description: |-
                      LastCommandNoteID is the newest command on the tracking issue the
                      operator has handled.
                    format: int64
                    type: integer
                  lastPilotCommand:
                    description: |-
                      LastPilotCommand is the newest queue command from the pilot handled
                      (status.pilot.commands).
                    format: int64
                    type: integer
                  mainRedFix:
                    description: |-
                      MainRedFix is the main-red issue (mainHealth.autoFix) this milestone
                      drives through the merge gate while the default branch is red.
                    properties:
                      decisions:
                        description: |-
                          Decisions recorded on the issue, collected when it was merged: the
                          newest 20; the full history is in the history database.
                        items:
                          description: DecisionRef points to a decision recorded on
                            an issue.
                          properties:
                            id:
                              type: string
                            superseded:
                              type: boolean
                            title:
                              type: string
                            url:
                              type: string
                          required:
                          - id
                          type: object
                        type: array
                      flakyFix:
                        description: |-
                          FlakyFix is set for a flaky job's issue handed to the agent
                          (fixFlaky, mainHealth.autoFixFlaky): not in the plan, it stays on a
                          re-plan.
                        type: boolean
                      iid:
                        format: int64
                        type: integer
                      markedReady:
                        description: |-
                          MarkedReady is set once the operator marked the draft MR ready, or
                          found it ready, to run CI. A draft again after that is a human holding
                          it, or a run that left problems.
                        type: boolean
                      mergeRequestIID:
                        description: MergeRequestIID and MergeRequestURL of the issue's
                          merge request.
                        format: int64
                        type: integer
                      mergeRequestURL:
                        type: string
                      mergedSHA:
                        description: MergedSHA is the commit the merge request was
                          merged as.
                        type: string
                      rebasedAt:
                        description: RebasedAt is when the rebase was requested.
                        format: date-time
                        type: string
                      rebasedDiff:
                        description: |-
                          RebasedDiff is a hash of the reviewed change, taken before the rebase.
                          The rebased head is only treated as reviewed if its change hashes the
                          same, i.e. the rebase moved the change without changing it.
                        type: string
                      rebasedFrom:
                        description: |-
                          RebasedFrom is the head the operator asked GitLab to rebase; set
                          while the rebase is in progress.
                        type: string
                      rebases:
                        description: Rebases counts the rebases of this item; only
                          one is attempted.
                        format: int32
                        type: integer
                      revisitOf:
                        description: |-
                          RevisitOf is set for follow-up issues the operator created to revisit
                          a decision of a merged issue: the decision's ID.
                        type: string
                      state:
                        description: AutopilotItemState is the state of one issue
                          in the queue.
                        enum:
                        - Pending
                        - Active
                        - Merged
                        - Skipped
                        type: string
                    required:
                    - iid
                    - state
                    type: object
                  mergeOverride:
                    description: |-
                      MergeOverride is an owner's decision to merge one head of an issue
                      without a full review (the `merge` command). A new head voids it.
                    properties:
                      at:
                        format: date-time
                        type: string
                      by:
                        description: By is who decided it.
                        type: string
                      issueIID:
                        format: int64
                        type: integer
                      sha:
                        description: SHA is the head it was given for.
                        type: string
                    required:
                    - at
                    - by
                    - issueIID
                    - sha
                    type: object
                  pauseKind:
                    description: |-
                      PauseKind is the cause of the pause, for the Desk's pause card. Empty
                      for a pause from before it was recorded.
                    enum:
                    - owner
                    - cycle
                    - stuck
                    - needsInput
                    - runFailed
                    - findings
                    - reviewErrors
                    - notReviewed
                    - ciRed
                    - ciCanceled
                    - mergeRequest
                    - mainRed
                    - config
                    type: string
                  pausedFor:
                    description: |-
                      PausedFor is the active issue the pause is about. Autopilot continues
                      by itself once that issue is merged or closed by hand, and, with
                      ResumeWhenReady, once it passes the merge gate again (a later run
                      fixed it).
                    format: int64
                    type: integer
                  pausedReason:
                    description: Reason why the milestone is paused.
                    type: string
                  phase:
                    description: AutopilotPhase is the state of an autopilot milestone.
                    enum:
                    - Running
                    - Paused
                    - Done
                    - "Off"
                    type: string
                  resumeWhenReady:
                    description: 'ResumeWhenReady: the pause is over PausedFor''s
                      run, review or CI.'
                    type: boolean
                  trackingHash:
                    description: |-
                      TrackingHash is the hash of the tracking issue's last rendered
                      description, so it is only edited when it changes.
                    type: string
                  trackingIssueIID:
                    description: TrackingIssueIID is the bot's tracking issue of the
                      milestone.
                    format: int64
                    type: integer
                required:
                - phase
                type: object
              blocked:
                description: |-
                  Blocked is set while the issue cannot go on for an outside reason;
                  the operator shows it with the blocked labels.
                properties:
                  applied:
                    description: |-
                      Applied is set once the issue carries the blocked labels. An applied
                      block whose issue lost the blocked label was lifted by a human.
                    type: boolean
                  message:
                    type: string
                  reason:
                    description: BlockReason is why an issue is blocked; it is the
                      suffix of its reason label.
                    enum:
                    - infra
                    - main-red
                    - quota
                    - dependency
                    type: string
                  restoreLabel:
                    description: RestoreLabel is the workflow label the blocked label
                      replaced.
                    type: string
                  since:
                    format: date-time
                    type: string
                required:
                - reason
                - since
                type: object
              chat:
                description: |-
                  Chat holds the runner's replies to Desk chat messages. The operator
                  copies them into chat_messages and drops the answered messages from
                  the spec.
                properties:
                  lastTurnTime:
                    description: LastTurnTime is when the runner last finished a chat
                      turn.
                    format: date-time
                    type: string
                  replies:
                    description: Replies are answers keyed by message id, newest last,
                      at most 20.
                    items:
                      description: ChatReply is one answer to a ChatMessage.
                      properties:
                        at:
                          format: date-time
                          type: string
                        error:
                          description: |-
                            Error is set when the turn did not finish normally (e.g. "interrupted",
                            "usage limit until <time>").
                          type: string
                        messageID:
                          format: int64
                          type: integer
                        pushedSHA:
                          description: PushedSHA is set when a writable turn committed
                            and pushed.
                          type: string
                        text:
                          description: Text is the agent's answer, made inert and
                            cut to 16 KiB.
                          maxLength: 16384
                          type: string
                      required:
                      - at
                      - messageID
                      type: object
                    maxItems: 20
                    type: array
                type: object
              ci:
                description: CI is the operator's view of the pipeline of the agent's
                  last push.
                properties:
                  failedJobs:
                    description: FailedJobs of the latest failed pipeline.
                    items:
                      type: string
                    type: array
                  pingedFor:
                    description: |-
                      PingedFor is the event the owners were last mentioned for on this
                      commit, so a pipeline run again in review does not ping them again
                      for the same thing. A ping is sent at most once: if its comment
                      fails, the comment is posted again without it.
                    enum:
                    - failed
                    - needsInput
                    - ciFailed
                    - review
                    - autopilotPaused
                    - autopilotDone
                    - mainRed
                    - blocked
                    type: string
                  pipelineID:
                    format: int64
                    type: integer
                  pipelineURL:
                    type: string
                  retried:
                    description: Retried is set once the failed jobs of the pipeline
                      were retried.
                    type: boolean
                  sha:
                    description: SHA of the pushed commit this status is about.
                    type: string
                  state:
                    description: CIState is the state of the pipeline of the agent's
                      last push.
                    enum:
                    - Pending
                    - Running
                    - Fixing
                    - Success
                    - Failed
                    - BaseFailing
                    - Canceled
                    - None
                    type: string
                required:
                - sha
                - state
                type: object
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
