                  reviewedFor:
                    description: |-
                      ReviewedFor is the head the last re-review was asked for
                      (spec.source.reviewFor).
                    type: string
                  reviewedSHA:
                    description: |-
                      ReviewedSHA is the commit the last review saw. Runs without a review
                      (CI fix runs) can push commits after it, so a clean review only covers
                      PushedSHA when the two are equal.
                    type: string
                  runCount:
                    description: RunCount is the number of runs performed so far.
                    format: int32
                    type: integer
                  summary:
                    description: Summary of the most recent run.
                    type: string
                  usageLimits:
                    description: |-
                      UsageLimits are the limits this task's runs went around with a
                      fallback engine instead of being deferred; the operator adds the
                      active ones to the project's usage limits.
                    items:
                      description: UsageLimit is an engine's active usage or rate
                        limit.
                      properties:
                        engine:
                          description: Engine is the coding agent CLI that runs a
                            role.
                          enum:
                          - claude
                          - cursor
                          type: string
                        message:
                          description: Message reported by the engine.
                          type: string
                        until:
                          format: date-time
                          type: string
                      required:
                      - engine
                      - until
                      type: object
                    type: array
                type: object
              runBlockedAt:
                description: |-
                  RunBlockedAt is the run.lastActivityTime of the deferral or failure
                  that last blocked the issue (run.blockReason). Each report blocks
                  once, so a block lifted by hand stays lifted.
                format: date-time
                type: string
              workspaceClaimName:
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
