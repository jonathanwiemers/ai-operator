apiVersion: v1
kind: Namespace
metadata:
  name: ai-operator-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-operator
  namespace: ai-operator-system
  labels:
    app.kubernetes.io/name: ai-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-operator
    spec:
      serviceAccountName: ai-operator
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: ghcr.io/jonathanwiemers/ai-operator:latest
          args: ["--leader-elect"]
          ports:
            - name: metrics
              containerPort: 8080
            - name: probes
              containerPort: 8081
          livenessProbe:
            httpGet: {path: /healthz, port: probes}
          readinessProbe:
            httpGet: {path: /readyz, port: probes}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
