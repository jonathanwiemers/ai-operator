# The checks of .github/workflows/ci.yml, one job per check, and the release
# job, the GitLab counterpart of .github/workflows/release.yml: on a release
# tag it publishes the images and the chart to registry.gitlab.com and adds
# the install section to the GitLab release (docs/releasing.md).

include:
  - project: jo.wiemers/devops/ci
    ref: v0.2.55
    file: ci-templates/build.yml

# Tag pipelines build releases: the operator (or a human) creates the tag.
# A newer pipeline cancels only interruptible jobs. With the default
# (conservative) it also cancelled a release still waiting for its resource
# group, and a following docs- or CI-only merge then released nothing.
workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE =~ /^(web|api)$/ && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

stages: [check, release]

default:
  tags: [shared]
  interruptible: true

.go:
  stage: check
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/golang:1.26
  variables:
    GOMODCACHE: $CI_PROJECT_DIR/.cache/go-mod
    GOCACHE: $CI_PROJECT_DIR/.cache/go-build
  cache:
    key:
      files: [go.sum]
    paths: [.cache/go-mod, .cache/go-build]

# No cache: controller-gen's paths=./... also walks .cache and trips over
# go.work files inside the module cache.
drift:
  extends: .go
  variables:
    GOMODCACHE: /go/pkg/mod
    GOCACHE: /root/.cache/go-build
  cache: []
  script:
    - make generate manifests ts-types
    - git diff --exit-code

gofmt:
  extends: .go
  cache: []
  script:
    - test -z "$(gofmt -l api cmd internal)"

vet:
  extends: .go
  script:
    - go vet ./...

# The research store tests need a real Postgres; with
# AI_TEST_REQUIRE_DATABASE they fail instead of skipping without one.
test:
  extends: .go
  services:
    - name: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/postgres:17
      alias: postgres
      # A throwaway database: without fsync the entrypoint's init server
      # shuts down at once instead of hanging in its checkpoint on a busy
      # runner ("pg_ctl: server does not shut down").
      command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]
  variables:
    POSTGRES_INITDB_ARGS: --no-sync
    POSTGRES_PASSWORD: postgres
    POSTGRES_DB: ai_operator_test
    AI_TEST_DATABASE_URL: postgres://postgres:postgres@postgres:5432/ai_operator_test?sslmode=disable
    AI_TEST_REQUIRE_DATABASE: "1"
    # Prints the service's own log into the job log, e.g. why it did not start.
    CI_DEBUG_SERVICES: "true"
  script:
    # Fail fast, with the service log above, when Postgres does not come up,
    # instead of a 30 s timeout in every store test.
    - |
      for i in $(seq 1 60); do
        bash -c "echo > /dev/tcp/postgres/5432" 2>/dev/null && break
        [ "$i" = 60 ] && { echo "postgres service is not listening on postgres:5432 after 120 s"; exit 1; }
        sleep 2
      done
    - go test -race ./...

# web/dist/.gitkeep is committed, so go:embed compiles without the ui job's
# output; this job checks the Go build, the ui job the web build.
build:
  extends: .go
  script:
    - make build

version:
  extends: .go
  cache: []
  variables:
    GIT_DEPTH: "0"
  script:
    - hack/next-version.sh

ui:
  stage: check
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/node:22-bookworm
  variables:
    npm_config_cache: $CI_PROJECT_DIR/.cache/npm
  cache:
    key:
      files: [web/package-lock.json]
    paths: [.cache/npm]
  script:
    - make ui

# Browser checks of the built Desk (docs/ui.md "Checks"): every route at
# 375, 768 and 1280 px with the server's CSP and a mocked API. The
# Playwright image is on mcr.microsoft.com, which the Dependency Proxy does
# not serve, so the node image installs Chromium and its libraries.
ui-e2e:
  stage: check
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/node:22-bookworm
  variables:
    npm_config_cache: $CI_PROJECT_DIR/.cache/npm
    PLAYWRIGHT_BROWSERS_PATH: $CI_PROJECT_DIR/.cache/ms-playwright
  cache:
    key:
      files: [web/package-lock.json]
      prefix: ui-e2e
    paths: [.cache/npm, .cache/ms-playwright]
  before_script:
    - cd web
  script:
    - npm ci
    - npx playwright install --with-deps chromium
    - npm run build
    - npm run e2e
  artifacts:
    when: always
    expire_in: 2 weeks
    expose_as: Desk screenshots
    paths: [web/e2e-results/]

helm-lint:
  stage: check
  image:
    name: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/alpine/helm:3.17.3
    entrypoint: [""]
  script:
    - apk add --no-cache make
    - make helm-lint

# A release is a decision, not a side effect of a merge (docs/releasing.md):
# pushes to main run the checks only. A release is a tag YEAR.MONTH.N on main
# with a GitLab release, which
#   - the operator creates through the API (planner, pilot, `/agent release`,
#     a milestone's final release, the sweep), with its notes, or
#   - a human creates (Deploy > Releases > New release, or
#     `glab release create <version> --ref main --notes "<why>"`).
# The tag's pipeline runs the checks and then this job, which publishes
#   - images  registry.gitlab.com/jo.wiemers/ai-operator:<version>,
#             registry.gitlab.com/jo.wiemers/ai-operator/agent:<version>
#   - chart   oci://registry.gitlab.com/jo.wiemers/ai-operator/charts/ai-operator --version <version>
# and adds the install section to the GitLab release (creates it for a bare
# tag). The operator follows the tag pipeline; GitHub's release.yml counts its
# own versions.
release:
  extends: .docker-build
  stage: release
  # Releases build one at a time, and a newer pipeline never cancels one,
  # started or queued (workflow auto_cancel).
  resource_group: release
  interruptible: false
  variables:
    CI_TOOLS_IMAGE: registry.gitlab.com/jo.wiemers/devops/ci:v0.2.55
  rules:
    - if: $CI_COMMIT_TAG =~ /^20\d\d\.\d+\.\d+$/
  script:
    - apk add --no-cache jq
    - VERSION="${CI_COMMIT_TAG}"
    - echo "Releasing ${VERSION}"
    # The operator reports its release and compares it with the tags
    # (--self-project): the Dockerfile's ARG VERSION, set in this job's
    # copy as its default (no build argument needed from jo-docker-build).
    - sed -i "s/^ARG VERSION=dev\$/ARG VERSION=${VERSION}/" Dockerfile
    - grep -qx "ARG VERSION=${VERSION}" Dockerfile
    - |
      # jo-docker-build creates the docker context tls-env and fails if it
      # already exists, so the second build needs it removed first.
      build() {
        docker context rm --force tls-env >/dev/null 2>&1 || true
        jo-docker-build \
          --dockerfile "$1" \
          --image "${CI_REGISTRY_IMAGE}$2" \
          --tag "${VERSION}" \
          --extra-tag latest \
          --platforms linux/amd64 \
          --registry "${CI_REGISTRY}" \
          --registry-password-env CI_JOB_TOKEN \
          --dependency-proxy-server "${CI_DEPENDENCY_PROXY_SERVER}" \
          --cache-ref "${CI_REGISTRY_IMAGE}/buildcache:$3"
      }
      build Dockerfile "" operator
      build Dockerfile.agent /agent agent
    - echo "${CI_JOB_TOKEN}" | helm registry login "${CI_REGISTRY}" --username gitlab-ci-token --password-stdin
    - helm package charts/ai-operator --version "${VERSION}" --app-version "${VERSION}" -d dist
    - helm push "dist/ai-operator-${VERSION}.tgz" "oci://${CI_REGISTRY_IMAGE}/charts"
    # The release the tag belongs to keeps its notes (the operator's are
    # untrusted text: they are only passed on as JSON, never evaluated); the
    # install section is appended once. A bare tag gets a release of its own.
    - |
      cat > install.md <<NOTES
      ## Install

      \`\`\`sh
      helm install ai-operator oci://${CI_REGISTRY_IMAGE}/charts/ai-operator --version ${VERSION} \\
        --namespace ai-operator-system --create-namespace \\
        --set image.repository=${CI_REGISTRY_IMAGE} \\
        --set agent.image.repository=${CI_REGISTRY_IMAGE}/agent \\
        --set 'agent.namespaces={agents}' --set agent.createNamespaces=true
      \`\`\`

      Images: \`${CI_REGISTRY_IMAGE}:${VERSION}\`, \`${CI_REGISTRY_IMAGE}/agent:${VERSION}\`
      NOTES
    - |
      api="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases"
      code="$(curl --silent --show-error --output release.json --write-out '%{http_code}' \
        --header "JOB-TOKEN: ${CI_JOB_TOKEN}" "${api}/${VERSION}")"
      case "${code}" in
      200)
        if jq -e '.description // "" | contains("## Install")' release.json >/dev/null; then
          echo "the release ${VERSION} has its install section"
        else
          jq -n --rawfile install install.md --slurpfile rel release.json \
            '{description: ((($rel[0].description // "") | if . == "" then "" else . + "\n\n" end) + $install)}' > body.json
          curl --fail-with-body --silent --show-error --request PUT \
            --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --header "Content-Type: application/json" \
            --data @body.json "${api}/${VERSION}"
        fi ;;
      404)
        jq -n --rawfile install install.md --arg v "${VERSION}" '{tag_name: $v, name: $v, description: $install}' > body.json
        curl --fail-with-body --silent --show-error \
          --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --header "Content-Type: application/json" \
          --data @body.json "${api}" ;;
      *)
        cat release.json; exit 1 ;;
      esac
