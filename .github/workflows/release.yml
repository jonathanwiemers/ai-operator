name: Release

# Publishes a GitLab release on GitHub. GitLab decides and tags releases
# (docs/releasing.md); the push mirror carries each tag YEAR.MONTH.N here, and
# this workflow builds that tag:
#   - images  ghcr.io/<owner>/ai-operator:<version>, ghcr.io/<owner>/ai-operator-agent:<version>
#   - chart   oci://ghcr.io/<owner>/charts/ai-operator --version <version>
#   - a GitHub release for the tag, with the packaged chart
# By hand (Run workflow) it publishes an existing tag, e.g. one the mirror
# pushed together with more than three others (GitHub then starts no run).
on:
  push:
    tags:
      - "20[0-9][0-9].[0-9]*.[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish, e.g. 2026.11.256"
        required: true

# Releases run one at a time, so the newest one ends up as :latest.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # The tag's main pipeline on GitLab ran the checks already, so this
      # only validates the tag and skips tags that already have a release.
      - name: Determine version
        id: version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! [[ "${TAG}" =~ ^[0-9]{4}\.[1-9][0-9]?\.[1-9][0-9]*$ ]]; then
            echo "::error::${TAG} is not a release tag YEAR.MONTH.N"
            exit 1
          fi
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "version=${TAG}" >> "$GITHUB_OUTPUT"
          echo "registry=ghcr.io/${owner}" >> "$GITHUB_OUTPUT"
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            echo "GitHub release ${TAG} exists; nothing to do"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Releasing ${TAG}"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.version.outputs.skip == 'false'
        with:
          ref: refs/tags/${{ steps.version.outputs.version }}

      - name: Tagged commit
        id: sha
        if: steps.version.outputs.skip == 'false'
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Two Go cross-builds of the Kubernetes client libraries plus the Node
      # based agent image do not fit into the default runner disk.
      - name: Free disk space
        if: steps.version.outputs.skip == 'false'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/share/powershell
          sudo docker image prune --all --force
          df -h /

      - uses: azure/setup-helm@v4
        if: steps.version.outputs.skip == 'false'

      - uses: docker/setup-qemu-action@v3
        if: steps.version.outputs.skip == 'false'
      - uses: docker/setup-buildx-action@v3
        if: steps.version.outputs.skip == 'false'

      - uses: docker/login-action@v3
        if: steps.version.outputs.skip == 'false'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push operator image
        if: steps.version.outputs.skip == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.version.outputs.registry }}/ai-operator:${{ steps.version.outputs.version }}
            ${{ steps.version.outputs.registry }}/ai-operator:latest
          # The operator reports it and compares it with the tags (--self-project).
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ steps.sha.outputs.sha }}

      - name: Prune build cache
        if: steps.version.outputs.skip == 'false'
        run: |
          docker buildx prune --all --force
          df -h /

      - name: Build and push agent image
        if: steps.version.outputs.skip == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.agent
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.version.outputs.registry }}/ai-operator-agent:${{ steps.version.outputs.version }}
            ${{ steps.version.outputs.registry }}/ai-operator-agent:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ steps.sha.outputs.sha }}

      - name: Package and push chart
        if: steps.version.outputs.skip == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REGISTRY: ${{ steps.version.outputs.registry }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          make helm-package VERSION="${VERSION}"
          helm push "dist/ai-operator-${VERSION}.tgz" "oci://${REGISTRY}/charts"

      - name: Create GitHub release
        if: steps.version.outputs.skip == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REGISTRY: ${{ steps.version.outputs.registry }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > notes.md <<NOTES
          ## Install

          \`\`\`sh
          helm install ai-operator oci://${REGISTRY}/charts/ai-operator --version ${VERSION} \\
            --namespace ai-operator-system --create-namespace \\
            --set 'agent.namespaces={agents}' --set agent.createNamespaces=true
          \`\`\`

          Images: \`${REGISTRY}/ai-operator:${VERSION}\`, \`${REGISTRY}/ai-operator-agent:${VERSION}\`
          NOTES
          gh release create "${VERSION}" "dist/ai-operator-${VERSION}.tgz" \
            --verify-tag --title "${VERSION}" --notes-file notes.md --generate-notes
