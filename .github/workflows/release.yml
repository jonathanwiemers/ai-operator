name: Release

# Once a day (or by hand via Run workflow), main is released with a calendar
# version YEAR.MONTH.N (2026.10.1, 2026.10.2, ...) if the operator, the agent
# image or the chart changed since GitHub's newest release tag:
#   - images  ghcr.io/<owner>/ai-operator:<version>, ghcr.io/<owner>/ai-operator-agent:<version>
#   - chart   oci://ghcr.io/<owner>/charts/ai-operator --version <version>
#   - git tag <version> and a GitHub release with the packaged chart
# Pushes to main no longer release (docs/releasing.md).
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

# Releases run one at a time so two merges never get the same version.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  # Ends the run early unless release-relevant code changed since the newest
  # calendar-version tag (the tags hack/next-version.sh counts). The paths are
  # those the former push trigger listed; docs-only days are not released.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for changes since the last release
        id: check
        run: |
          last="$(git tag --list '20*.*.*' --sort=-v:refname | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)"
          if [ -z "${last}" ]; then
            echo "No release tag yet; releasing"
            echo "release=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "${last}" HEAD -- \
              api cmd internal charts web config/crd \
              Dockerfile Dockerfile.agent go.mod go.sum; then
            echo "No release-relevant change since ${last}; nothing to release"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Release-relevant changes since ${last}:"
            git diff --stat "${last}" HEAD -- \
              api cmd internal charts web config/crd \
              Dockerfile Dockerfile.agent go.mod go.sum
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: changes
    if: needs.changes.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Two Go cross-builds of the Kubernetes client libraries plus the Node
      # based agent image do not fit into the default runner disk.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/share/powershell
          sudo docker image prune --all --force
          df -h /

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: azure/setup-helm@v4

      - name: Test
        run: |
          go test ./...
          make helm-lint

      - name: Determine version
        id: version
        run: |
          version="$(hack/next-version.sh)"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "registry=ghcr.io/${owner}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${version}"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push operator image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.version.outputs.registry }}/ai-operator:${{ steps.version.outputs.version }}
            ${{ steps.version.outputs.registry }}/ai-operator:latest
          # The operator reports it and compares it with the tags (--self-project).
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Prune build cache
        run: |
          docker buildx prune --all --force
          df -h /

      - name: Build and push agent image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.agent
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.version.outputs.registry }}/ai-operator-agent:${{ steps.version.outputs.version }}
            ${{ steps.version.outputs.registry }}/ai-operator-agent:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Package and push chart
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REGISTRY: ${{ steps.version.outputs.registry }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          make helm-package VERSION="${VERSION}"
          helm push "dist/ai-operator-${VERSION}.tgz" "oci://${REGISTRY}/charts"

      - name: Tag and create GitHub release
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REGISTRY: ${{ steps.version.outputs.registry }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag "${VERSION}" "${GITHUB_SHA}"
          git push origin "refs/tags/${VERSION}"
          cat > notes.md <<NOTES
          ## Install

          \`\`\`sh
          helm install ai-operator oci://${REGISTRY}/charts/ai-operator --version ${VERSION} \\
            --namespace ai-operator-system --create-namespace \\
            --set 'agent.namespaces={agents}' --set agent.createNamespaces=true
          \`\`\`

          Images: \`${REGISTRY}/ai-operator:${VERSION}\`, \`${REGISTRY}/ai-operator-agent:${VERSION}\`
          NOTES
          gh release create "${VERSION}" "dist/ai-operator-${VERSION}.tgz" \
            --title "${VERSION}" --notes-file notes.md --generate-notes
