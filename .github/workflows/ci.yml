name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # The research store tests need a real Postgres.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_operator_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AI_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/ai_operator_test?sslmode=disable
      AI_TEST_REQUIRE_DATABASE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Generated code and manifests are up to date
        run: |
          make generate manifests ts-types
          git diff --exit-code
      - name: gofmt
        run: test -z "$(gofmt -l api cmd internal)"
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race ./...
      - name: web UI (type-check and build)
        run: make ui
      - name: build
        run: make build
      - name: helm lint
        run: make helm-lint
      - name: release version
        run: hack/next-version.sh
