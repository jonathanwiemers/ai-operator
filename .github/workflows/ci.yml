name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Generated code and manifests are up to date
        run: |
          make generate manifests
          git diff --exit-code
      - name: gofmt
        run: test -z "$(gofmt -l api cmd internal)"
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race ./...
      - name: build
        run: make build
