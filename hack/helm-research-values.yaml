# Values for make helm-lint: renders the chart with the research database of
# netcup01 (Zalando postgres-operator, see docs/configuration.md) and the UI.
research:
  database:
    host: ai-operator-postgres.ai-operator-system.svc.cluster.local
    name: ai_operator
    ownerSecret: {name: research-owner.ai-operator-postgres.credentials.postgresql.acid.zalan.do}
    readerSecret: {name: research-reader.ai-operator-postgres.credentials.postgresql.acid.zalan.do}
    readerRole: research_reader
    writerRoles: [agents.research_writer]
    networkPolicyPeer:
      namespace: ai-operator-system
      podLabels: {cluster-name: ai-operator-postgres}
agent:
  namespaces: [agents]
  networkPolicy:
    enabled: true
# The web UI with the Research section (reader login, agentresearches RBAC).
ui:
  enabled: true
  auth:
    mode: none
  authorization:
    rules:
      - roles: [ai-operator-admin]
      - roles: [researchers]
        research: write
        researches: ["agents/*"]
  research:
    allowCreate: true
    namespace: agents
# Prices for estimated cursor costs (ConfigMap, mount and --pricing-file).
pricing:
  models:
    "cursor/auto": {input: 1.25, output: 10, cacheRead: 0.125, cacheWrite: 1.25}
    "cursor/*": {input: 3, output: 15}
